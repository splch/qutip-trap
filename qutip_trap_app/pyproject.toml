[project]
name = "qutip-trap-app"
version = "0.1.0"
description = "One simulated trapped-ion run at five zoom levels, from the histogram down to the Hamiltonian terms; a Flet app on qutip-trap"
readme = "README.md"
requires-python = ">=3.13,<3.15"
authors = [{ name = "Spencer Churchill", email = "25377399+splch@users.noreply.github.com" }]
dependencies = [
    "qutip-trap",
    "flet>=0.86,<1.0",
    "flet-charts>=0.86,<1.0",
]

[tool.uv.sources]
qutip-trap = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# the layout `flet create` makes: src/main.py is the entry point, src/qutip_trap_app/ the package
packages = ["src/qutip_trap_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src/qutip_trap_app"]
mypy_path = "src:.."  # the core is type-checked from its source tree; it ships no py.typed
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["qutip", "qutip.*", "scipy", "scipy.*", "flet_charts", "flet_charts.*"]
ignore_missing_imports = true

[tool.flet]
org = "io.github.splch"
product = "qutip-trap-app"
company = "qutip-trap"
copyright = "Copyright (C) 2026 Spencer Churchill"

[tool.flet.app]
path = "src"
# the tests, the Flutter build tree and the test host never ship in a bundle
exclude = ["tests", "build", ".flet", "__pycache__"]
