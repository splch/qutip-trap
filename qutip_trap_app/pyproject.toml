[project]
name = "qutip-trap-app"
version = "0.1.0"
description = "Zoomable trapped-ion simulator application (PLAN.md Section 14) over qutip-trap"
readme = "README.md"
requires-python = ">=3.13,<3.15"
authors = [{ name = "Spencer Churchill", email = "25377399+splch@users.noreply.github.com" }]
dependencies = [
    "qutip-trap",
    "flet>=0.86,<1.0",
    "flet-charts>=0.86,<1.0",
]

[project.scripts]
qutip-trap-app = "qutip_trap_app.__main__:cli"

[dependency-groups]
dev = [
    # `flet test` integration tests: pytest-asyncio and the Flutter test host's client
    "flet[test]>=0.86,<1.0",
]

[tool.uv.sources]
qutip-trap = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# src/main.py is the entry point, src/qutip_trap_app/ the package
packages = ["src/qutip_trap_app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "tests"]
markers = [
    "ui: Flet integration tests that drive the Flutter client (`flet test`); skipped unless QUTIP_TRAP_APP_UI_TESTS=1",
    "slow: runs that take minutes (a second device with its calibration and channel library); deselect locally with -m 'not slow'",
]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src/qutip_trap_app"]
mypy_path = "src"
warn_unreachable = true
# Flet leaves some of its public API unannotated (the input filters' constructors); calling it is not an untyped call of ours
untyped_calls_exclude = ["flet"]

[[tool.mypy.overrides]]
module = ["qutip", "qutip.*", "scipy", "scipy.*", "flet_charts", "flet_charts.*", "yaml"]
ignore_missing_imports = true

[tool.flet]
org = "io.github.splch"
product = "qutip-trap-app"
company = "qutip-trap"
copyright = "Copyright (C) 2026 Spencer Churchill"

[tool.flet.splash]
# the page colours of views/theme.py, so a built app opens on its own background in either scheme
color = "#F7F7F5"
dark_color = "#131314"

[tool.flet.app]
path = "src"
# the tests, the Flutter build tree and the provisioned test host never ship in a bundle
exclude = ["tests", "build", ".flet", "__pycache__"]
