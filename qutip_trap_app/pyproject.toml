[project]
name = "qutip-trap-app"
version = "0.1.0"
description = "Zoomable trapped-ion simulator application (PLAN.md Section 14, milestone M11); consumes qutip-trap through its public API only"
readme = "README.md"
requires-python = ">=3.13,<3.14"
authors = [{ name = "Spencer Churchill", email = "25377399+splch@users.noreply.github.com" }]
dependencies = [
    "qutip-trap",
    "flet[all]>=0.86,<1.0",
    "flet-charts>=0.86,<1.0",
]

[dependency-groups]
dev = [
    # Integration testing with `flet test` / pytest. The `test` extra brings in
    # pytest, pytest-asyncio and the screenshot-comparison dependencies.
    "flet[test]>=0.86,<1.0",
]

[tool.uv.sources]
qutip-trap = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# the src layout `flet create` made: src/main.py is the entry point, src/qutip_trap_app/ the package (M11.1)
packages = ["src/qutip_trap_app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "tests"]
markers = [
    "ui: Flet integration tests that drive the Flutter client (`flet test`); skipped unless QUTIP_TRAP_APP_UI_TESTS=1",
    "slow: runs that take minutes (a second device with its calibration and channel library); deselect locally with -m 'not slow'",
]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src/qutip_trap_app"]
mypy_path = "src:.."  # the core is type-checked from its source tree; it ships no py.typed
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["qutip", "qutip.*", "scipy", "scipy.*", "flet_charts", "flet_charts.*", "yaml"]
ignore_missing_imports = true

[tool.flet]
org = "io.github.splch"
product = "qutip-trap-app"
company = "qutip-trap"
copyright = "Copyright (C) 2026 Spencer Churchill"

[tool.flet.app]
path = "src"
