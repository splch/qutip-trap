name: ci

# a push or a pull request runs the fast tier; the nightly schedule and a manual dispatch run everything
on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      # one BLAS thread per xdist worker: threaded BLAS on the suite's small matrices oversubscribes the runner
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --group dev
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run mypy
      - name: pytest
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then SEL="not heavy"; else SEL="not slow and not heavy"; fi
          uv run pytest -m "$SEL" -n 4 --dist loadscope --timeout 1800 --timeout-method thread -rfEs --durations=20
      # several gigabytes of resident memory each: run alone, after the parallel pass
      - name: pytest (heavy)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: uv run pytest -m heavy --timeout 1800 --timeout-method thread -rfEs

  app:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-packages --extra gui --group dev
      - run: uv run mypy
        working-directory: qutip_trap_app
      - name: the provenance index is current with the ledger and PLAN.md
        run: uv run python -m qutip_trap_app.provenance --check
      - run: uv run --package qutip-trap-app pytest qutip_trap_app/tests --timeout 1800 --durations=10

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv build --out-dir dist
      - name: the package imports without the dev group
        run: uv run --no-dev python -c "import qutip_trap"
