name: ci

on:
  push:
  pull_request:
  # the full suite, slow tests included, nightly and on demand; a push or a pull request runs the fast tier
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # one BLAS thread per process: pytest-xdist already runs a process per CPU
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

jobs:
  core:
    name: lint, types, tests
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --group dev
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run mypy
      - name: pytest
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then SEL="not heavy"; else SEL="not slow and not heavy"; fi
          uv run pytest -m "$SEL" -n 4 --dist loadscope --timeout 1800 -rfEs --durations=20
      # tests that peak at several gigabytes of memory run alone, after the parallel pass
      - name: pytest (heavy tests, one at a time; nightly and on demand)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: uv run pytest -m heavy --timeout 3600 -rfEs --durations=10

  release:
    name: build and import without the dev group
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv build --out-dir dist
      - run: uv run --no-dev python -c "import qutip_trap as trap; print(trap.presets.yb171_chain(2).device.hash())"

  app:
    name: application
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-packages --extra gui --group dev
      - run: uv run flet doctor
      - run: uv run mypy
        working-directory: qutip_trap_app
      - run: uv run --package qutip-trap-app pytest qutip_trap_app/tests -q -n 4 --timeout 1800 --durations=10
