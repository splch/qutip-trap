name: ci

on:
  push:
  pull_request:

jobs:
  validation-checks:
    name: Appendix D check scripts on the pinned toolchain (first job, PLAN.md M0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Sync the pinned environment (Python from .python-version, versions from uv.lock)
        run: uv sync --group dev
      - name: Re-run the check scripts and compare with the committed outputs
        run: uv run python validation/scripts/run_checks.py --report
      - name: Upload the convergence report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: convergence-report
          path: validation/report/

  core:
    name: lint, type-check, tests
    needs: validation-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --group dev
      - name: ruff (lint and format)
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: mypy --strict (the Hz / rad-s types are enforced here)
        run: uv run mypy
      - name: provenance ledger is current with the species tables
        run: uv run python tools/ledger_from_tables.py --check
      - name: documentation tables are current with the ledger (M10)
        run: uv run python tools/docs_from_ledger.py --check
      - name: import time of the root and of the Appendix E surface (tests/test_import_time.py holds the root under 0.2 s)
        run: |
          uv run python -X importtime -c "import qutip_trap" 2>&1 | tail -1
          uv run python -X importtime -c "import qutip_trap.api" 2>&1 | tail -1
      - name: pytest
        run: uv run pytest
      - name: convergence tests (Section 5.5 / 9.9) as a junit report for the convergence-report artifact
        if: always()
        run: |
          mkdir -p validation/report
          uv run pytest -m convergence --junitxml=validation/report/convergence_tests.xml -q
      - name: Upload the convergence-test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: convergence-tests
          path: validation/report/convergence_tests.xml

  release:
    name: the 0.1.0 release checks - `uv build` and the import without the dev group (M10)
    needs: validation-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: build the wheel and the sdist
        run: uv build --out-dir dist
      - name: the public API imports without the dev group (Appendix E)
        run: uv run --no-dev python -c "import qutip_trap.api as a; print(len(a.__all__), 'public names')"

  gui:
    name: Flet extra installs and `flet doctor` passes (M0)
    needs: validation-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --extra gui
      - run: uv run flet doctor

  app:
    name: "the application package (Section 14 / M11): lint, types, provenance index, view-model tests"
    needs: validation-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-packages --extra gui --group dev
      - name: ruff (lint and format) on the app
        run: |
          uv run ruff check qutip_trap_app
          uv run ruff format --check qutip_trap_app
      - name: mypy --strict on src/qutip_trap_app
        run: uv run mypy
        working-directory: qutip_trap_app
      - name: the provenance index asset is current with the ledger and PLAN.md
        run: uv run python -m qutip_trap_app.provenance --check
      - name: view-model tests (Section 9.11 rows of M11.1; the Flet UI tests are skipped without the Flutter client)
        run: uv run --package qutip-trap-app pytest qutip_trap_app/tests -q
