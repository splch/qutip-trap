  - id: anchor.m7.intensity_noise_n_ions
    symbol: "A = N Gamma_I t_g eta^2/2, B = A x 3(N - 1)/(4K)"
    tag: contested
    section: "9.16 row 4.4-8; 4.4.7; 6.4"
    source: "M7 audit E-2, re-derived and re-measured independently of check_noise.py (force model, d = 40, k = 2e-6, eta = 0.1, mesolve atol 1e-12; tests/test_noise_budgets.py)"
    equation: "in the sigma_alpha eigenbasis block s closes with a residual displacement s x delta_alpha, <|delta_alpha|^2> = f^2 (2 Gamma_I/Omega^2) t_g with f = eta Omega/2; the pair (s, s') decoheres by exp(-|s - s'|^2 <|delta_alpha|^2>(2 nbar + 1)/2), so 1 - F = Var(sum_i s_i)(2 nbar + 1)(eta^2/2) Gamma_I t_g and Var = N for |0...0>. Measured A/(Gamma_I t_g eta^2/2) = 1.00002, 2.00035, 3.00622, 2.00003, 1.99998, 3.00038 at (N, K) = (1,1), (2,1), (3,1), (2,2), (2,3), (3,2), and B/plan_B = 1.99939, 2.99441, 1.99989, 2.00005, 2.99922 - a factor N in BOTH terms. B/A = 3(N-1)/(4K) exactly (0.74964, 1.49411, 0.37497, 0.25001, 0.74971)"
    corrected_form: "the Gamma_I convention is SETTLED, not open: the plan's derived A = Gamma_I t_g eta^2/2 is exact at N = 1 with Gamma_I the carrier-contrast rate k Omega^2, so the retired reading of this record (that the plan's A pairs with half the contrast rate or another fidelity measure) was a wrong inference from the N = 2 case. What the plan's eps_I first term is missing is a factor N for an N-ion drive; the same Var(sum s_i) = N is Hughes's lambda^2_{S_alpha} (anchor.m7.hughes_two_term), which is the cross-check that fixes it. 9.16 row 4.4-8's A/(eta^2 Gamma_I t_g/2) = 0.997-0.999 and B/[3(N-1)/(8K)] ~ 1.00 across all five (N, K) are therefore NOT reproducible in this model - both are N times larger - and the row's model must divide the collective operator's variance by N (equivalently define Gamma_I as N times the single-ion contrast rate). New: only a GLOBAL intensity-noise operator gives B/A = 3(N-1)/(4K); N independent per-beam operators leave A(N) unchanged but halve the ratio to 3(N-1)/(8K) (measured 0.37469, 0.74563, 0.18746 at (2,1), (3,1), (2,2)), so the plan's B term is itself evidence that its eps_I describes one laser shared by the register"
  - id: anchor.m7.hughes_two_term
    symbol: "I = (2 nbar + 1)|alpha_t|^2 Var(S_alpha) + (delta_theta^2/4) Var(S_alpha^2)"
    tag: extracted
    section: "9.7 row 'Mode-frequency fluctuation'; 6.2"
    source: "Hughes, Srinivas, Loeschnauer, Knaack, Matt, Ballance, Malinowski, Harty and Sutherland, 'Trapped-ion two-qubit gates with >99.99% fidelity without ground-state cooling', arXiv:2510.17286 (2025), Appendix B 'Infidelity Due to Mode Frequency Fluctuations', Eq. 33; read from the source because the plan transcribes only the first term"
    equation: "alpha_t = int_0^{t_g} eps(t) gamma(t) dt and delta_theta = 2 int_0^{t_g} eps(t)|gamma(t)|^2 dt with H_e = hbar eps(t) a^dag a (Eq. 29) and U_g = exp{(gamma a^dag - gamma* a) S_alpha} exp{-i (theta/2) S_alpha^2} (Eq. 27). For a CONSTANT fractional offset on a symmetric K-loop gate |alpha_t| = (pi sqrt K/2)(eps/delta) and delta_theta = (pi/2)(eps/delta), the second being K-INDEPENDENT. Verified against exact two- and three-ion propagation of the plan's own force model: the exact-to-closed-form ratio extrapolates to 1.0000 with a linear-in-eps remainder (0.990568, 0.995311, 0.997671, 0.998873 at eps/delta = 4e-3, 2e-3, 1e-3, 5e-4 for N = 2, K = 1, nbar = 0 -> 1.000076), at every (N, K, nbar) in {(2,1,0), (2,1,1), (2,2,0), (3,1,0), (3,1,2), (2,3,0)}"
    corrected_form: "the source's lambda^2_{S_alpha} and lambda^2_{S_alpha^2} are the VARIANCES of the two spin operators over the input state, not the bare moments <S^2> and <S^4>: the first coincides with <S_alpha^2> = N because <S_alpha> = 0 on |0...0> (which is why the plan prints it that way), but the second is <S^4> - <S^2>^2 = 2N(N - 1) and reading it as <S^4> = 3N^2 - 2N overshoots by a factor 2 at N = 2 and 1.75 at N = 3. The exact propagation discriminates them"
  - id: conv.beam_phase_spectrum
    symbol: "NoiseModel.beam_phase_noise -> phi_j(t) per beam; eps = [int S_phi F] (4 g^2/Delta^2)^2"
    tag: extracted
    section: "6.3; 7.10 'the optical path difference between two Raman beams sets the beat-note phase'"
    source: "M7 audit E-9 (noise/model.py, noise/sampling.key_beam_phase_trajectory_rad, validation/noise_closed_forms.baldwin_phase_noise_infidelity; tests/test_m7_closed_forms.py; dynamics/hamiltonian._beam_phase_trajectory; tests/test_m7_beam_phase_builder.py)"
    equation: "each beam gets its own realization of the SAME declared spectrum, so a Raman pair's beat note sees phi_2(t) - phi_1(t) with twice one beam's variance (measured 2.00 x sigma^2 over 120 seeds) and a co-propagating pair (one shared path, declared as one beam) sees none. The builder reads the sampled Delta phi(t) with the convention of key_beam_phase_rad (phi_2 - phi_1 for a Raman or light-shift pair, -phi_1 for a single beam) and multiplies the beat note by e^{-i Delta phi(t)} beside a single-photon drive's own laser phase, so constant trajectories reproduce the quasi-static build to 1e-12 and a common-mode path drift cancels (tests/test_m7_beam_phase_builder.py). The Baldwin form's (4 g^2/Delta^2) enters as its SQUARE, so halving the two-photon-to-detuning ratio drops eps by exactly 4"
    corrected_form: "before this the only laser-phase route was KEY_LASER_PHASE_TRAJECTORY on single-photon optical drives, so route (d) was unreachable for the phase-sensitive Raman geometries Section 6.3 names, and there was no per-beam or beat-note phase spectrum field at all. Kirchmair's 2e-3 per gate from incoherent carrier excitation and the Rabi-drift anchors (Kirchmair 1.4e-2, Harty 5e-4) are recorded as consistency anchors in validation/noise_closed_forms.py"
