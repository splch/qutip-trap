    corrected_form: "the pumping is frozen at the neighbours' start classes, the first-order form the factored confusion tensor uses, because one ion's chain is sampled before its neighbours' paths are known; the polarization share of the leaked light that reaches the pumping channel is a device parameter defaulting to the bound of 1"
