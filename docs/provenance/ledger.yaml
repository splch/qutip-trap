    corrected_form: "the scale gives 7.4e4 quanta of a 1 MHz mode for H2 at 300 K on 171Yb+, ABOVE Section 6.7's parenthetical 'tens to thousands' (which is reached at a few MHz for a lighter ion or a heavier gas ratio); the formula the plan specifies is implemented rather than tuned to the parenthetical. Two limitations are declared in Diagnostics.approximations rather than hidden: a kick landing after the preparation discards the shot instead of adding its nbar to the already-evolved sample (the dynamical samples are propagated before the shot loop), and a reorder permutes RunState.order and discards the shot without re-deriving b_{i,m}, eta_{i,m} or the pair sign s of Section 7.7 for the shots that follow"
  - id: conv.scattering_channels_at_d_gt_2
    symbol: "internal_levels > 2 => SolverOptions.scattering_channels = True, scattering_recoil = 'off' unless 'vector' was asked for"
    tag: corrected
    section: "4.5.5 'Leakage is therefore simulated, not estimated, whenever d > 2'"
