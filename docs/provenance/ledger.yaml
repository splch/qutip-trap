    equation: "a 30 V/m stray field on a single 171Yb+ ion at Omega_rf = 2 pi x 30 MHz gives beta = 0.245 along the Raman Delta k; the sideband-ratio scan through the exact e^{i beta cos Omega t} modulation nulls it at -30.00 +- 0.46 V/m with a residual |beta| of 2.5e-4, and the rf-photon-correlation periodic steady state of the 369.5 nm detection beam, retuned to -Gamma/2 and projected on the atom's response phase (odd in the signed index, linear to 15 % at beta = 0.2), nulls a 20 V/m field at -20.0000 +- 2.8 V/m from the exact signal (the photon budget of a 1 s acquisition at 3.8e5 photons/s and 4.4 % detection efficiency) and at -19.27 +- 0.83 V/m (0.87 sigma) with photon shot noise drawn over 10 s, residual beta -7.9e-5 +- 4.5e-3, on the two-ion fixture"
    corrected_form: "the first M8 build correlated the photon rate at the fixture's detection frequency (on resonance) and kept only the sin projection: there the first-order response vanishes (the rate is even in the detuning) and the first harmonic was |S_1| = 3.2e-5 at beta = 0.045 against 3.4e-2 half a linewidth to the red, so the null was found exactly but its declared photon-budget uncertainty was 3.3e3 V/m; the response lags the rf by 141 degrees at Omega_rf = 1.5 Gamma, and a fixed sin projection kept 63 % of the amplitude"
