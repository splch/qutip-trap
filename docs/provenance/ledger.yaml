  - id: conv.depolarizing_normalization
    symbol: "Lambda_eps(rho) = (1 - eps) rho + eps/(4^n - 1) sum_{P != I} P rho P"
    tag: verified
    section: "13 Depolarizing normalization; 6.8; 9.10 Depolarizing conversions; M7, M10"
    source: "Chen et al. 2023; Trout et al. 2018 (the uniform p/3 and p/15 weights); Qiskit Aer depolarizing_error; noise/summary.py; tests/test_m10_benchmarks.py"
    equation: "the depolarizing channel is written with the UNIFORM weight eps/(4^n - 1) on each of the 4^n - 1 non-identity Paulis, in which eps is exactly the entanglement infidelity, so the rate the simulator reports IS the entanglement infidelity and the average gate infidelity is d/(d + 1) eps, (2/3) eps at n = 1 and (4/5) eps at n = 2; as Kraus operators that is sqrt(1 - eps) 1 together with sqrt(eps/3) X, Y, Z on one qubit or sqrt(eps/15) P over the fifteen non-identity two-qubit Paulis, and sum_K K^dag K = 1 to 1e-12 for every eps in [0, 1] (noise/summary.py depolarizing_kraus, whose Choi state depolarizing_choi is built from); the parameter Qiskit's depolarizing_error takes is the mixing weight of the maximally mixed state, lambda = eps 4^n/(4^n - 1), so Chen et al.'s Forte medians 2.0e-4 (single-qubit) and 46.4e-4 (two-qubit, direct RB) enter Qiskit as 2.67e-4 and 49.5e-4 (noise/summary.py qiskit_depolarizing_lambda)"
    corrected_form: "Trout 2018's p/3 and p/15 are the same weights under a different name for the parameter, not a different channel; Qiskit's lambda is NOT that p, and passing a published p to Qiskit as a lambda understates the rate by 4^n/(4^n - 1), 33 % on one qubit and 6.7 % on two. Kept separate from conv.rb_error_rate, whose p is a decay BASE, and from conv.gate_fidelity_measure, whose F_K is a unitary overlap: this row is a channel RATE"
  - id: conv.rotation_generators
    symbol: "R(theta, phi) carries theta/2; XX(chi) carries chi with no 1/2"
    tag: corrected
    section: "13 Rotation generators; 7.1; 9.7"
    source: "Maslov 2017; Trout et al. 2018; control/native.py; control/two_qubit.py; noise/summary.py"
    equation: "a single-qubit rotation carries theta/2 in the exponent, R(theta, phi) = exp[-i (theta/2)(cos phi sigma_x + sin phi sigma_y)], so GPi2(phi) = R(pi/2, phi) exactly and GPi(phi) = i R(pi, phi) (equal up to the global phase every fidelity measure quotients), with RZ(theta) = diag(e^{-i theta/2}, e^{i theta/2}); the two-qubit generator carries chi with NO 1/2, XX(chi) = exp(-i chi sigma_x (x) sigma_x), chi = pi/4 maximally entangling and the native MS angle theta = 2 chi in [0, pi/2]. No shared generator helper computes both: each is written where it is used (control/native.py gpi, gpi2, r_phi, rz, xx, ms, zz), because one factor 1/2 shared between the two conventions would halve every entangling angle. The consequence for the twirl is that Trout 2018's over-rotation probability p_xx = sin^2 alpha for exp(-i alpha XX) is the TWO-qubit case only, and it is exposed under that name (noise/summary.py over_rotation_twirl_probability)"
    corrected_form: "reading Maslov's R gates and Trout's XX through one generator convention is a factor 2 in the entangling angle; the plan's row exists to forbid the shared helper, and the code has none"
  - id: conv.gate_fidelity_measure
    symbol: "F_K = (1/4)|Tr(U_id^dag U)|^2"
    tag: corrected
    section: "13 Gate fidelity measure; 4.3.5; 6.9"
    source: "Kabytayev et al. 2014 Sec. II B; Cummins et al. 2003 Eq. 7; Merrill and Brown Eqs. 10-11; control/composite.py"
    equation: "for a single-qubit UNITARY error the internal measure is F_K = (1/4)|Tr(U_id^dag U)|^2, the normalization the composite-pulse library and the Section 6.9 filter functions are built to and the one that floors at 1/2 for a fully wrong qubit gate; F_C = |Tr(U_id^dag U)|/2 = sqrt(F_K) and F_avg = (2 F_C^2 + 1)/3 = (2 F_K + 1)/3 are exposed as conversions, so 1 - F_K = 2(1 - F_C) and 1 - F_avg = (4/3)(1 - F_C) at leading order, and every ingested c-coefficient is tagged with the measure it was quoted in (control/composite.py fidelity_k and the measure argument of the error models); at small spectral-norm distance E between unitaries 1 - F_C ~ E^2/2 while 1 - F_K ~ E^2, so the plan's 'converted as E^2/2' is the F_C form. The plan's row says to keep this separate from the RB row and the depolarizing row, and it is separate: conv.rb_error_rate converts a decay BASE p, conv.depolarizing_normalization a channel RATE eps, this row a unitary OVERLAP"
    corrected_form: "Low, Yoder and Chuang's F = ||U V^dag|| is identically 1 for a qubit under its own Eq. 2 norm and Brown, Harrow and Chuang's 1 - ||V^dag U|| identically 0 for unitaries; both are replaced by F_K. The row had no ledger record of its own although the M10 modules cite it by name, which Section 14.5's one-record-per-quantity rule asks for"
