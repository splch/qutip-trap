    source: "dynamics/tomography.py (motional_branches tail rule, keyed_tolerances, TomographyRecord.branch_error_bound, tolerances, tolerance_change); dynamics/engine.py (SolverOptions.tomography_dropped_weight_max, tomography_tolerance_keyed, margin_element_tol; required_margin_under); hilbert/operators.py (required_margin with element_tol and tail, displacement_leakage, interior_element_error); hilbert/space.py (ModeTruncation.element_tol); run/gate_local.py (step_space, GateLocalStep.branch_error_bound, tolerance_change, element_error, GateLocalReport.discrepancy_bound); bench_tomography.py part 4; tests/test_tomography.py; tests/test_hilbert_layer.py; tests/test_gate_local.py"
    equation: "three GATE_LOCAL relaxations keyed to the map accuracy eps_map, each declared, each with a reported term summed into GateLocalReport.discrepancy_bound (performance pass 2026-09-09, Tier 2). (1) The tail rule: the lightest motional branches of a step are dropped one at a time while the total dropped weight stays inside tomography_dropped_weight_max (eps_map/4 unless set, 0 keeps every branch above branch_weight_min); a channel that is a convex mixture sum_b w_b E_b changes by ||E_full - E_kept||_diamond <= 2w when weight w is dropped and the rest renormalized, and 2w is the reported term; the four-qubit GHZ circuit's entangling steps keep 18 of 41 branches. (2) The keyed tolerance: a unitary step with resolved modes integrates at atol = 1e-5 eps_map and rtol = 1e-3 eps_map (1e-8 and 1e-6 at the default) instead of Section 5.3's 1e-10 and 1e-8 when the caller left those at their defaults, and the dominant branch's columns are re-integrated ten times tighter: d times the trace norm of the change in its Choi matrix, weighted by the branch's share, bounds the diamond-norm change and is the reported term (Section 5.5's convergence statement). On the example device's entangling step (dimension 572, one branch) the keyed pair costs 63510 right-hand sides against 113934 (2.32 against 4.16 s) and moves the channel by 1.3e-4 in d ||Delta C||_1 (2.5e-6 in the largest Choi element, 1.0e-5 in the outputs), the ten-times-tighter change 1.2e-4 tracking it; one loosening further (1e-7, 1e-5) moves it 1.7e-3, past eps_map, which is why the rule stops there. (3) The derived margin: the step space's cap keeps the smallest margin at which the exponential's interior elements over the populated block n, n' <= n_hi agree with the analytic elements to margin_element_tol (1e-5 eps_map = 1e-8 unless set), measured directly because the error at a fixed margin grows with the populated range (eta = 0.1, margin 3: 3.0e-11, 8.9e-11, 7.4e-10, 5.9e-9, 6.2e-8, 7.7e-7 at n_hi = 1, 2, 5, 10, 20, 40; margin 2: 3.3e-8 to 9.7e-5; margin 4: 2.0e-14 to 3.9e-9), and at which one displacement from n_hi leaks less than a tenth of boundary_population_max past the cap (the analytic elements: eta = 0.1, n_hi = 5: 1.0e-3, 9.1e-6, 5.1e-8, 2.1e-10 past 1, 2, 3, 4 levels), never more than the Section 5.1.1 fixture; the engine's margin check reads the same rule and the rule (ii) oracle asserts the declared tolerance at construction. At eta = 0.1 the margin is 3 for n_hi up to 10 (the fixture: 6); the GHZ entangling steps' caps fall from (10, 10, 12) to (7, 7, 9), dimension 4800 to 1764. Together: the four-qubit GHZ circuit through GATE_LOCAL 205 -> 24 s on 18 workers (856 s before the pass), its entangling steps 76 engine runs each (4 x 18 branches + the 4-column probe), P(0000) = 0.46 and P(1111) = 0.3875 unchanged to the printed digits, the register fidelity 0.84362 against 0.84371 (a change of 9e-5) with the reported bound 0.0535 against 0.0458 (the two new terms add 7.7e-3); the example device's Bell circuit through GATE_LOCAL 5.1 -> 3.2 s (2000 shots; the entangling step at dims (2, 2, 8, 10) instead of (2, 2, 11, 13), 6 branches instead of 10)"
