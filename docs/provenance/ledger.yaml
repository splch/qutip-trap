    tag: recomputed here
    section: "7.5 item 7"
    source: "check_calibration.py 3; experiments/light.py stark_scan"
    equation: "with one beam of the Raman pair on during the Ramsey delay there is no two-photon coupling and the fringe shift is that beam's differential light shift; the drive's shift is their sum (-19.2 - 19.2 = -38.4 Hz on the two-ion fixture, recovered within its uncertainty)"
    corrected_form: "the both-beams-on measurement with the beat note detuned by Delta carries the odd coupling shift Omega^2/(2 Delta) (1.27 kHz at Delta = 4 MHz), whose fringe at probe minus shift aliases with the plan's Ramsey delays (Nyquist 2.5 kHz for six points over 1 ms); kept as mode='beat_note' with that caveat"
  - id: anchor.m8.crosstalk_phase_protocol
