    tag: corrected
    section: "7.9 Randomized benchmarking variants; 6.6; 13 RB error rate; M10"
    source: "Gambetta et al., PRL 109, 240504 (2012); Magesan 2011; benchmarks/rb.py; tests/test_m10_benchmarks.py"
    equation: "simultaneous RB draws INDEPENDENT single-qubit Clifford sequences on several ions and plays them interleaved, so the group is the product C1 x ... x C1 and Section 13's n-qubit Clifford formula does not describe the joint decay. Every benchmarked qubit's own MARGINAL survival P(qubit q reads its target bit) is therefore fitted to A p_q^m + B and reported as r_q = (1 - p_q)/2 (RBResult.marginal_error_per_clifford), one Clifford on ONE qubit the unit -- the unit of the r that qubit measures alone and of the per-qubit composition budget.predicted['r_channel.q{i}'] = (Cliffords per sequence) x sum_kinds (pieces per Clifford) x (the kind's GATE_LOCAL channel reduced to THAT ONE qubit) -- and RBResult.error_per_clifford is their mean. The JOINT survival is fitted too and its (1 - p)(2^n - 1)/2^n kept as RBResult.joint_error_per_layer, the error per LAYER of n Cliffords, which equals sum_q r_q to first order (0.2 % at r_q = 2e-5, 3 % at 3.4e-4 over m up to 512) and is compared with r_channel_joint_layer, the same composition over one layer with the channels reduced to ALL benchmarked qubits"
    corrected_form: "the first version reported the JOINT decay's (1 - p)(2^n - 1)/2^n as 'the error per Clifford' beside a budget whose unit was one single Clifford, a factor n apart, and the check script divided r_channel by 2 to compare them; anchor.m10.simultaneous_rb_crosstalk then read that factor 2 as a physical finding. Two independent qubits at r_q = r_channel = 3.426e-4 reproduce the committed joint fit p = 0.999080 to 3.5 % in (1 - p), so the composition already predicts the simultaneous decay. Separately, 'two_qubit = len(qs) == 2 and bool(run_kwargs.pop(\"pair\", True))' short-circuited past its own pop on any qubit count but two, leaving pair= in the kwargs splatted into run() and raising TypeError: simultaneous RB on three ions, the natural use of a variant whose point is chain crosstalk, could not run at all"
