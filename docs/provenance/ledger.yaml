# Provenance ledger (PLAN.md Section 14.5): one record per quantity with the fields
#   id, symbol, tag, section, source, equation, corrected_form
# read by the core (Device.derived() provenance ids, qutip_trap.provenance.load_ledger) and by the application's
# provenance chips. `section` names the PLAN.md sections that specify the quantity; `tag` records what checking was
# done (PLAN.md preamble), never that a value is final; `corrected_form` states the corrected form where a source or an
# extracted form is wrong. conv.* records are conventions (Section 13), anchor.* the numbers a test or the code pins,
# published.* the published values the application places beside simulated ones.
records:
  - id: conv.frequencies
    symbol: "omega = 2 pi nu"
    tag: corrected
    section: "13; 5.6"
    source: "RMP 2003 (Leibfried et al.)"
    equation: "internal frequencies angular in rad/s; public API in Hz, converted at the boundary with an explicit 2 pi"
    corrected_form: "papers quote gamma = 2 pi x 19.6 MHz, gamma/2pi = 60 MHz and 19.7 MHz for gamma/2pi interchangeably; names carry the unit (_hz, _rad_s, _hz_per_g, _per_s)"
  - id: conv.mathieu_sign
    symbol: "a - 2q cos 2xi"
    tag: verified
    section: "13; 4.1.1"
    source: "Leibfried et al. 2003"
    equation: "d^2x/dxi^2 + [a - 2q cos 2xi] x = 0, xi = omega_rf t/2, a = 4Z|e|U alpha/(m omega_rf^2), q = 2Z|e|U~ alpha'/(m omega_rf^2)"
    corrected_form: "Wineland 1998 and Berkeland 1998 use +2q cos (a half-period shift); factor-4 q definitions elsewhere; House 2008 has Q = -q and prints its first-order matrix with the wrong sign"
  - id: conv.floquet_phase_origin
    symbol: "u(t) ~ e^{i nu t}[1 - (q/2) cos omega_rf t]"
    tag: corrected
    section: "13; 4.1.1"
    source: "RMP 2003 Eqs. 16-29; Wineland 1998 Eq. 4; qutip_trap.trap.mathieu"
    equation: "u_dot(0) = i nu (1 + q) at u(0) = 1 in the adopted sign; C0 = 1 + 3q^2/16 even in q"
    corrected_form: "the RMP's quantum section and Wineland's trajectory use [1 + (q/2) cos], i nu (1 - q): the same physics half an rf period later"
  - id: conv.micromotion_correction
    symbol: "C0"
    tag: corrected
    section: "13; 4.1.1"
    source: "Wineland Eqs. 71-72; Berkeland Eq. 21; qutip_trap.trap.mathieu"
    equation: "eta_eff = eta C0, C0 the e^{i nu t} Fourier coefficient of the exact Floquet function normalized by Im(u* u_dot) = nu: C0 = 1 + 3q^2/16 + O(q^4) (1.007741 at q = 0.2)"
    corrected_form: "the RMP's (1 + q/2)^-1 is the u(0) = 1 normalization at one rf phase, an rf-clock artifact"
  - id: conv.ladder_operators
    symbol: "x0"
    tag: verified
    section: "13"
    source: "RMP Eq. 26"
    equation: "x = x0 (a + a^dagger), x0 = sqrt(hbar/(2 m omega))"
    corrected_form: "Brownnutt arXiv v1 prints a with sqrt(hbar m omega); Ozeri 2007 and Baldwin 2021 put a factor 4 under the root"
  - id: conv.lamb_dicke
    symbol: "eta_{i,m}"
    tag: verified
    section: "13; 4.1.7"
    source: "Wineland 1998 Eq. 33; Monroe 2020; Home 2013 Eq. 19; Morigi-Walther Eq. 12"
    equation: "eta_{i,m} = (Delta k . e_m) c_{i,m} sqrt(hbar/(2 m_i omega_m)) with the ion's own mass and the mass-weighted unit-norm eigenvector component; C0 applied once in Crystal.lamb_dicke; C0 is the ion's own species' (a, q): explicit frequencies scale from Trap.reference_mass_u as m_ref/m_i (a 40Ca+ ion beside 88Sr+ in a (3.0, 2.9, 1.0) MHz, 60 MHz trap takes 1.019948, not 88Sr+'s 1.003867)"
    corrected_form: "Sorensen-Molmer's and Leung's per-ion COM eta already contains 1/sqrt N; Srinivas puts the total two-ion mass inside r0; the reference species' (a, q) labelled with another ion's mass gave it the reference's C0 (eta 1.6 % low) and a 2.2x micromotion amplitude"
  - id: conv.mode_index
    symbol: "mode: int"
    tag: corrected
    section: "13; 4.1.3"
    source: "qutip_trap.trap.crystal (Crystal.modes)"
    equation: "every mode index is a position in Crystal.modes, ordered axial, transverse_1, transverse_2, ascending frequency within a family; eigenvectors unit norm, last component positive"
    corrected_form: "an index is never the eigensolver output order, a frequency order across families or a (family, index) pair"
  - id: conv.rabi_frequency
    symbol: "Omega"
    tag: verified
    section: "13; 4.3.1"
    source: "RMP 2003; Monroe 2020; Lee 2005"
    equation: "H = (hbar Omega/2) sigma_+ e^{...} + h.c., carrier pi pulse at Omega t = pi"
    corrected_form: "Wineland 1998, Monroe 1995 and Blumel 2021 use P = sin^2(Omega t), half the usual Rabi frequency"
  - id: conv.effective_wavevector
    symbol: "Delta k = k_1 - k_2"
    tag: corrected
    section: "13"
    source: "RMP; Wineland 1998; Lee 2005"
    equation: "beam 1 couples to the upper level; |Delta k| = 2k sin(theta_cross/2) from the configured geometry; k for one beam, 0 for a microwave"
    corrected_form: "Landsman's k = k_2 - k_1; Lee's arXiv v1 Eq. 2 inverts its own beam-to-level assignment (the journal version is right)"
  - id: conv.wavelengths_vacuum
    symbol: "lambda_vac"
    tag: corrected
    section: "4.5.7; 13"
    source: "James 1998; Roos 2000; NIST Sr II compilation"
    equation: "k = 2 pi/lambda_vac; every stored wavelength is a vacuum wavelength"
    corrected_form: "James's Fig. 4 quotes the calcium wavelengths in air (729.147 nm; vacuum 729.347 nm); an air value used as vacuum biases k by 274 ppm and gives the wrong laser frequency outright"
  - id: conv.saturation_intensity
    symbol: "I_sat"
    tag: corrected
    section: "13; 4.5.2"
    source: "Steck"
    equation: "I_sat = pi h c Gamma_partial/(3 lambda_vac^3) with Gamma_partial = 2 pi gamma_hz x branching ANGULAR; 171Yb+ 369.5 nm: 50.83 mW/cm^2"
    corrected_form: "gamma_hz fed in unconverted gives 8.09 mW/cm^2 (a 2 pi in every saturation parameter); Acton prints hbar for h; the random-orientation hbar omega^3 Gamma/(4 pi c^2) is exactly 3x the cycling value"
  - id: conv.linewidth_gamma
    symbol: "Gamma"
    tag: verified
    section: "13"
    source: "Noek 2013; Crain 2019"
    equation: "Gamma is the angular population decay rate of the upper level's TOTAL decay; gamma_hz = Gamma/2pi; the partial rate into a lower level is Gamma x branching"
    corrected_form: "an assertion checks Gamma/2pi equals the quoted MHz"
  - id: conv.hyperfine_dipole_element
    symbol: "<F mF|d_q|F' mF'>"
    tag: verified
    section: "13; 4.5.2"
    source: "Steck (Rb87 data, Eqs. 35-38)"
    equation: "<F mF|d_q|F' mF'> = <J||d||J'> (-1)^{F'+J+1+I} sqrt((2F'+1)(2J+1)) {J J' 1; F' F I} (-1)^{F'-1+mF} sqrt(2F+1) (F' 1 F; mF' q -mF); q = m_lower - m_upper"
    corrected_form: "the ingest test reproduces the 171Yb+ 1/3 : 2/3 branching and the 50.8 mW/cm^2 I_sat"
  - id: conv.hyperfine_factors
    symbol: "S_FF', b(F'->F)"
    tag: corrected
    section: "13"
    source: "Steck Rb87 Eqs. 40-42"
    equation: "S_FF' = (2F'+1)(2J+1){J J' 1; F' F I}^2 summing to one over excited F' (absorption); b(F'->F) = (2F+1)(2J'+1){...}^2 summing to one over ground F (emission)"
    corrected_form: "one 'hyperfine factor' used in both roles is off by (2F+1)(2J'+1)/((2F'+1)(2J+1))"
  - id: conv.nuclear_g_sign
    symbol: "g_I"
    tag: recomputed here
    section: "13; 4.5.1"
    source: "Steck; Harty 2014"
    equation: "g_I = -(mu_I/(I mu_N))(m_e/m_p), so H_Z = mu_B (g_J J_z + g_I I_z) B/hbar with one sign for both; 43Ca+ g_I = +2.0467e-4 from mu_I = -1.31535 mu_N"
    corrected_form: "Harty's g_I^(N) = mu_I/(I mu_N) with a minus sign and Langer's g_I = -mu_I/(I mu_B) with a plus are self-consistent alternatives that must not be mixed: 83.76 kHz and 0.207 G off for 43Ca+"
  - id: conv.sign_A_hfs_and_g_factors
    symbol: "sign(A_hfs), g_S"
    tag: corrected
    section: "13; 4.5.6"
    source: "Steck; Langer 2005; Harty 2014"
    equation: "A_hfs is a signed input inferred from mu_I when not printed (9Be+, 43Ca+, 171Yb+ 3D[3/2]1/2 inverted); measured g_J replaces Lande, and without a measurement the Lande value with this g_S, never NIST's g_S = 2 rounding; Steck's g_S = +2.0023193 (CODATA g_e is negative); nuclear Zeeman in Steck's form with a plus sign in H_B"
    corrected_form: "A > 0 removes the clock points (no 43Ca+ point in 1 to 4000 G, no 9Be+ root in 8 to 16 mT), the ingest test of the sign"
  - id: conv.curvature_naming
    symbol: "d2nu_dB2, taylor_c2"
    tag: corrected
    section: "13; 4.5.1; 6.3"
    source: "Harty 2014; Langer 2005"
    equation: "d2nu_dB2 (Harty's 2.4 mHz/mG^2) and taylor_c2 = (1/2) d2nu/dB2 (Langer's 0.305 Hz/uT^2; 171Yb+'s 310.8 Hz/G^2) stored separately; accumulated phase 2 pi int [nu(B) - nu(B0)] dt with the bracket in Hz"
    corrected_form: "one field named 'curvature' silently mixes a factor 2; the missing 2 pi is 6.28 in both of Langer's figures"
  - id: conv.mass_ion
    symbol: "mass_u"
    tag: recomputed here
    section: "13; 5.6"
    source: "AME via NIST"
    equation: "Species.mass_u is the ION mass, the cited atomic mass minus one electron mass (171Yb+: 170.93578 u from 170.9363302 u); the Lamb-Dicke anchor must state its mass"
    corrected_form: "eta(N = 17) rounds to 0.0267 at 171 u and 0.0268 at the ion mass"
  - id: conv.polarization_components
    symbol: "eps_q"
    tag: corrected
    section: "13; 4.5.3"
    source: "Steck QAO Eqs. 7.188-7.190, 7.419-7.422; Rb87 Eqs. 34-37, 54-55"
    equation: "eps = sum_q eps_q e_q about B, e_{+-1} = -+(x +- i y)/sqrt 2, e_0 = z; helicity q_gamma = +1 (sigma+), 0 (pi), -1 (sigma-) for absorption |F mF> -> |F' mF + q_gamma>; operator index q_op = m_lower - m_upper = -q_gamma"
    corrected_form: "Steck's tables list sigma+ under q = -1: the helicity and operator-index labels are interchanged there"
  - id: conv.electric_field_noise
    symbol: "S_E"
    tag: corrected
    section: "13; 4.1.5"
    source: "Brownnutt Eqs. 11-12"
    equation: "single-sided S_E; Gamma_h = e^2 S_E/(4 m hbar omega)"
    corrected_form: "two-sided gives e^2 S_E/(2 m hbar omega); Turchette's arXiv preprint prints Eq. 3 inconsistent by 2 (the published PRA is consistent); the filter-function stack uses two-sided spectra, converted explicitly at the boundary"
  - id: conv.heating_master_equation
    symbol: "Gamma(N_bar + 1), Gamma N_bar"
    tag: corrected
    section: "13; 4.1.5"
    source: "Wineland Eq. 62 (typo fixed); Brownnutt Eqs. 15-17"
    equation: "rates Gamma(N_bar + 1) on a and Gamma N_bar on a^dagger; a quoted heating rate is d<n>/dt at n = 0, i.e. Gamma N_bar; thermal diffusion Gamma(2 N_bar + 1)"
    corrected_form: "the journal prints 2 a rho^dagger a^dagger, a typesetting artifact absent from both arXiv versions"
  - id: conv.qubit_dephasing_operator
    symbol: "L = sqrt(gamma_phi/2) sigma_z"
    tag: corrected
    section: "13; 5.7; 6.3"
    source: "standard Lindblad dephasing (qutip_trap.dynamics.channels)"
    equation: "coherence decays at gamma_phi, so gamma_phi = 1/T2 for the white component; a measured T2 is split into quasi-static (Gaussian) and white (exponential) parts before use"
    corrected_form: "sources that write the decay rate as 2/T2 use another operator normalization"
  - id: conv.rayleigh_dissipator
    symbol: "c = (1/2) sqrt(Gamma_el) sigma_z"
    tag: recomputed here
    section: "13; 4.5.5"
    source: "Uys et al. 2010 Eqs. 6-8"
    equation: "dissipator prefactor Gamma_el/4 while the coherence decays at Gamma_el/2, both consistent; Raman operators sqrt(Gamma_du)|u><d| carry the plain rate"
    corrected_form: "sqrt(Gamma_el/2) sigma_z doubles the dephasing"
  - id: conv.rf_amplitude_pseudopotential
    symbol: "V_rf peak"
    tag: corrected
    section: "13; 4.1.6"
    source: "House; Wesenberg; Chiaverini; Madsen; Home; Kielpinski"
    equation: "V_rf is the PEAK of a cos(Omega_rf t) drive; psi = Q^2|E|^2/(4 m Omega^2) in joules (eV at the boundary)"
    corrected_form: "reading the stored peak as rms doubles the depth and inflates every rf-set secular frequency by sqrt 2, and as peak-to-peak quarters the depth and halves those frequencies"
  - id: conv.ms_closure
    symbol: "eta Omega/eps = 1/(2 sqrt K)"
    tag: corrected
    section: "13; 4.4.1"
    source: "Sorensen-Molmer 2000; Kirchmair 2009; Roos 2008"
    equation: "the force on S_y is -(hbar eta Omega/2)(a^dagger e^{i eps t} + h.c.) for the per-tone Omega; closure eta Omega/eps = 1/(2 sqrt K) in every spin normalization; targets -pi/2 on J_y^2, -pi/8 on S_y^2, pi/4 on sigma_y sigma_y"
    corrected_form: "the closure is not 1/(4 sqrt K), which is a factor-2 force error; Roos's Omega_c = |eps|/(4 eta) reads |eps|/(2 eta) in this Omega, and his (J0 + J2)(4 Omega_R/delta) reads (J0 + J2)(2 Omega/delta) (the exact chi ratio 0.96238 against 0.96233 at 2 Omega/mu, 0.856 at 4 Omega/mu)"
  - id: conv.entangling_angle
    symbol: "chi_ij"
    tag: corrected
    section: "13; 4.4.3"
    source: "Choi 2014; Maslov 2017; Debnath 2016"
    equation: "chi_ij = sum_m eta_im eta_jm int int [Omega_i(t) Omega_j(t') + Omega_j(t) Omega_i(t')] ... with the pair sum over i < j; maximally entangling at chi = pi/4; XX(chi) = exp(-i chi sigma_x sigma_x)"
    corrected_form: "Choi's printed factor 2 holds only for proportional envelopes; Blumel's kernel with target pi/8 must be doubled; Roos's and Kirchmair's pi/8 comes from S without the 1/2 and must not be rescaled"
  - id: conv.gate_parameters
    symbol: "turns"
    tag: corrected
    section: "13; 7.6"
    source: "IonQ documentation"
    equation: "radians internally; IonQ turns at the API boundary (1 turn = 2 pi); phases enter as e^{+-2 pi i phi}, angles as cos(pi theta), sin(pi theta)"
    corrected_form: "the documentation's prose that GPi2 at phi = 0.5 gives R_x(+pi/2) contradicts its own matrix (it is R_x(-pi/2))"
  - id: conv.native_ms_matrix
    symbol: "MS(phi0, phi1, theta)"
    tag: verified
    section: "7.6"
    source: "IonQ documentation; qiskit-ionq, ionq-core-python and PennyLane-IonQ client code"
    equation: "MS(phi0, phi1, theta) = exp[-i pi theta GPi(phi0) (x) GPi(phi1)] with theta in turns in [0, 0.25]; GPi(phi) = [[0, e^{-2 pi i phi}], [e^{2 pi i phi}, 0]]; GPi2(phi) = (1/sqrt 2)[[1, -i e^{-2 pi i phi}], [-i e^{2 pi i phi}, 1]]; ZZ(theta) = diag(e^{-i pi theta}, e^{i pi theta}, e^{i pi theta}, e^{-i pi theta}); XX(chi) = MS(0, 0, theta) with chi = pi theta"
  - id: conv.virtual_z_propagation
    symbol: "phi -> phi - theta"
    tag: corrected
    section: "13; 7.6"
    source: "IonQ documentation; qutip_trap.control.native"
    equation: "RZ(theta) shifts every later pulse phase phi -> phi - theta, gates read in time order: RZ(theta), GPi(0.5), GPi2(0) equals GPi(0.5 - theta), GPi2(-theta) followed by RZ(theta)"
    corrected_form: "IonQ's printed +theta holds in matrix order, not in time order"
  - id: conv.result_bit_order
    symbol: "qubit0_lsb"
    tag: verified
    section: "13; 8.6"
    source: "IonQ OpenAPI v0.4; qiskit-ionq and PennyLane-IonQ client code"
    equation: "qubit 0 is the least-significant bit of the decimal histogram key; {\"5\": 0.5, \"7\": 0.5} on three qubits <-> bitstrings 101, 111; shots [\"6\",\"1\",\"0\",\"7\"] <-> 110, 001, 000, 111"
    corrected_form: "PennyLane reverses the order to big-endian (checked against the client sources)"
  - id: conv.readout_figure_of_merit
    symbol: "eps = (eps_B + eps_D)/2"
    tag: verified
    section: "13"
    source: "Myerson; Burrell; Harty; Christensen"
    equation: "eps = (1/2)(eps_B + eps_D), both reported"
    corrected_form: "Acton's min(F_B, F_D)"
  - id: conv.saturation_ceiling
    symbol: "P_f^max = n_e/(n_e + n_g)"
    tag: background
    section: "13; 8.1"
    source: "Berkeland Eqs. 13-14 and 21 (the special cases; the general form derived)"
    equation: "P_f^max = (2J_f + 1)/((2J_i + 1) + (2J_f + 1)): Gamma/4 for 3 ground + 1 excited, Gamma/3 for a Lambda system, Gamma/2 for a two-level atom"
    corrected_form: "not the two-level Lorentzian's Gamma/2 on a degenerate manifold, nor a 'naive four-level' 1/2 for the 171Yb+ detection line"
  - id: conv.solver_integrators
    symbol: "dop853, vern9"
    tag: recomputed here
    section: "5.3"
    source: "QuTiP 5.3.1 integrators; qutip_trap.dynamics.evolve"
    equation: "the escalation ladder is dop853 then vern9; never a multistep method; atol 1e-10, rtol 1e-8"
  - id: conv.seed_keys
    symbol: "SeedSequence(root, spawn_key=(sample, trajectory, shot, ion, channel))"
    tag: corrected
    section: "3.4"
    source: "numpy.random.SeedSequence; qutip_trap.run.pipeline"
    equation: "one root SeedSequence per run spawned by (sample, trajectory, shot, ion, channel); a run over 1 and 18 workers agrees shot by shot and to 1e-12, because the engine averages trajectories in keyed order"
    corrected_form: "the shot slot is needed because photon counts are sampled per shot per ion; QuTiP's MultiTrajResult accumulates in completion order (4.4e-16 apart) and is not used for the average"
  - id: conv.device_hash
    symbol: "Device.hash()"
    tag: corrected
    section: "3.3"
    source: "qutip_trap.hashing"
    equation: "canonical serialization: fields in declaration order, floats to 12 significant digits, ndarrays as dtype, shape and C-order bytes, dicts by sorted key, callables by qualified name plus a source digest, Qobj excluded, fields marked metadata hash=exclude (Device.roles) left out; the same device gives the same digest in every process"
    corrected_form: "Python's hash() is not supplied by frozen=True for ndarray, dict and Qobj fields"
  - id: conv.static_error_primitive
    symbol: "M(theta, phi; eps_a, eps_d)"
    tag: verified
    section: "4.3.5; 13"
    source: "Kabytayev 2014 Sec. II A; Merrill and Brown; Cummins 2003; Mount 2015; qutip_trap.control.composite"
    equation: "M = exp[-i theta {(1 + eps_a) rho(phi).sigma + eps_d sigma_z}/2], rho(phi) = (cos phi, sin phi, 0), exact for a square segment under time-independent errors; leading coefficients at theta = pi in 1 - F_K: primitive (pi^2/4) eps_a^2 and eps_d^2 exactly"
    corrected_form: "Mount's R = exp[-(i/2) theta (1 + eps)(sigma_phi + delta Z)] and Cummins' quaternion pulse (axis (cos phi, sin phi, eps_d)/sqrt(1 + eps_d^2), angle theta sqrt(1 + eps_d^2)) identify eps_a = g and eps_d = f = delta/nu_1 with no rescaling on ingest"
  - id: anchor.composite.sk1_sign
    symbol: "phi_SK1 = arccos(-theta/(4 pi))"
    tag: corrected
    section: "4.3.5"
    source: "Brown, Harrow, Chuang 2004; Cummins Eq. 24 (sign corrected); Kabytayev Sec. II B"
    equation: "target (theta, phi) followed by the correctors (2 pi, phi + phi_SK1), (2 pi, phi - phi_SK1); leading coefficient 22.830256 eps_a^4 = (pi^2 sin 2 phi_1)^2 at theta = pi; APn at n = 1 is SK1"
    corrected_form: "the printed SK1 corrector sign is a negative control: a primitive followed by the printed order is not an amplitude-correcting pulse"
  - id: anchor.composite.bb1
    symbol: "BB1, NB1"
    tag: recomputed here
    section: "4.3.5; 9.2"
    source: "Wimperis 1994; Kabytayev 2014"
    equation: "phi_1 = arccos(-theta/(4 pi)); segments (pi, phi + phi_1), (2 pi, phi + 3 phi_1), (pi, phi + phi_1) after the target; leading coefficient 9.388566 eps_a^6 at theta = pi; order-ladder slopes 2.998 (primitive) and 5.996 (BB1) on (1e-2, 1e-1); NB1 is the narrowband sibling with the same phase set"
  - id: anchor.composite.pb1_five_pulses
    symbol: "PB1"
    tag: recomputed here
    section: "4.3.5"
    source: "Wimperis 1994; Kabytayev 2014 Table I"
    equation: "the five-pulse passband sequence; leading coefficient 118.295935928 eps_a^4 at theta = pi; order-ladder slope 6.000 in amplitude and 2.000 in detuning"
  - id: anchor.composite.suzuki_factor
    symbol: "f_j = (2^{2j-1} - 2) f_{j-1}"
    tag: corrected
    section: "4.3.5"
    source: "Low, Yoder, Chuang 2014; Cummins Eq. 7; Kabytayev Sec. II B"
    equation: "the Trotter-Suzuki factor of the cached T_{2j-2} block, f_2 = 24 (P4 at 37 pulses gives 1.61629e-10); the phases arccos(-theta/(8 pi)) and arccos(-theta/(48 pi)) follow"
    corrected_form: "the printed f_2 = 28 and f_2 = 14 variants (the source's -1 defect) are negative controls; every Trotter-Suzuki phase is root-found on the leading eps coefficient rather than taken from the closed form"
  - id: anchor.composite.corpse
    symbol: "CORPSE, short CORPSE"
    tag: recomputed here
    section: "4.3.5"
    source: "Cummins, Llewellyn, Jones 2003 Table I; Kabytayev 2014"
    equation: "winding n = (1, 1, 0): angles (367.5645, 345.1291, 7.564528) deg at theta = 30, (371.4689, 337.9378, 11.4689) at 45, (384.2952, 318.5904, 24.29519) at 90, (420, 300, 60) at 180; leading coefficient 6.50075189242e-3 eps_d^4 at theta = pi; total duration 4.3333 pi"
    corrected_form: "short CORPSE (winding (0, 1, 0)) folds to -R, a global phase, so a distance that does not quotient the phase misreports its order"
  - id: anchor.composite.scrofulous
    symbol: "SCROFULOUS 180_60 180_300 180_60"
    tag: recomputed here
    section: "4.3.5"
    source: "Cummins, Llewellyn, Jones 2003; Kabytayev 2014"
    equation: "at theta = pi the three segments 180_60, 180_300, 180_60; leading coefficients 4.566051 eps_a^4 and 4.000000 eps_d^2 (four times the primitive detuning sensitivity)"
    corrected_form: "non-uniform areas, so the LYC certificate of equal-area families is refused for it"
  - id: anchor.composite.concatenated_durations
    symbol: "CinSK, CinBB"
    tag: verified
    section: "4.3.5"
    source: "Kabytayev 2014 Table I"
    equation: "reduced CinSK: the CORPSE block then (2 pi, -phi_1), (2 pi, +phi_1); reduced CinBB: the CORPSE block then (pi, phi_1), (2 pi, 3 phi_1), (pi, phi_1); durations CORPSE 4.3333 pi, CinSK and CinBB 8.3333 pi, SK1 and BB1 5 pi; slope 4 under simultaneous eps_a = eps_d where SK1, BB1 and CORPSE fall to 2; CinBB keeps BB1's 9.388566 amplitude coefficient"
  - id: anchor.composite.mount_pd6
    symbol: "PDn (n = 2, 6), B2"
    tag: recomputed here
    section: "4.3.5; 9.2"
    source: "Mount et al. 2015"
