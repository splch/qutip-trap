    section: "8.1; 13"
    source: "qutip_trap.readout.fluorescence"
    equation: "epsilon_sys carries exactly one epsilon_filter and an interference filter passes one wavelength, so R_o counts photons on the species' CYCLING line only: detection_rates_for_ion passes line = '<lower><-<upper>' of species.cycling, rates_from_bloch derives the single non-sink line when the build has one and REFUSES to guess when it has several, and line=ALL_LINES is an explicit all-line diagnostic (the total scattering rate W(Delta) of Section 4.2.2), never a detected rate"
