    equation: "recursion equals brute force to 1e-14 in log; with ideal Poisson statistics the exact chain's optimum is eps = 1.24e-4 at n_c = 3.5, t_b = 320 us and 1.37e-4 at the paper's (5.5, 420 us) against the measured 1.8(1)e-4; time-resolved ML Monte Carlo eps_D ~ 1.0e-4 to 1.5e-4 with eps_B <= 5e-5 (paper 1.5(2)e-4, asymptote 0.87e-4); adaptive 60/177 us average (paper 72/219 us)"
