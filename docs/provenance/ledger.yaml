  - id: anchor.m7.decoupling_high_precision
    symbol: "Section 9.15's mpmath rows, in the package"
    tag: recomputed here
    section: "9.15 rows 'Bang-bang suppression orders (mpmath >= 200 dps)', 'IR convergence on a 1/omega^4 spectrum', 'Filter-function limits and parities', 'END-TO-END dephasing normalization'; 6.9"
    source: "M7 audit E-14 (noise/decoupling.biercuk_taylor_coefficients_mp / leading_taylor_order_mp / biercuk_filter_function_mp / chi_integral_mp; tests/test_decoupling_mpmath.py)"
    equation: "all reproduced at mp.dps = 220-250. Carr-Purcell: amplitude Taylor order 3 at every even n with c_3 = i/(8 n^2) = 0.03125i, 0.0078125i, 0.003472222222i, 0.001953125i at n = 2, 4, 6, 8 (the plan's four printed values), and order 2 at odd n with c_2 = -1/(4 n^2); |c_2|^2 = 1/(16 n^4) and |c_3|^2 = 1/(64 n^4) ARE the plan's two printed CPMG coefficient laws. UDD: order n + 1 for n = 2, 3, 4, 5, 6, 8, 10, 12 with every lower coefficient below 10^{-110}, and F/(omega tau)^{2n+2} = 1/(16^n (n!)^2) to 12 digits for n = 1..8. IR convergence at tau = 1, tau_pi = 0.05, omega_max = 50: chi(1e-7) -> chi(1e-8) = 2.48719319 -> 24.8683571 (ratio 9.9985627) for UDD 3 and 2.48684517 -> 24.868009 (9.999822) for UDD 5, against 1.20925691e-4 and 2.39513137e-5 at ratio exactly 1.0 for n = 4 and 6. Green Eq. 45: 4.75678006346 against Biercuk's 0.0396431177199 at n = 1, identical at even n, |R_zz(0)|^2 = 4 exactly at n = 1, 3, 5. <a_1^2> = 0.06875600894468 from the double integral of C(t1 - t2), independently of the spectral integral"
    corrected_form: "the even-n IR rows CANNOT be reproduced in float64 and this is now asserted as a negative control: the even-n finite-pulse F is (omega tau)^2 (omega tau_pi)^4/64, which at omega = 1e-6 is 1e-43 of an O(1) sum, so double precision returns omega-independent cancellation noise of order 1e-32, which turns the omega^-4 integrand into omega^-6 and makes the package report chi(1e-7) = 128.56 for UDD-4 and 92.83 for UDD-6 (ratios 107 and 19) against true values of 1.2e-4 and 2.4e-5. The retired claim in conv.filter_function_machinery that check_composite.py's sections 9-15 are 'reproduced by noise/decoupling.py' was true for the finite-pulse collapse, the gated Biercuk values and the dc floors, and false for these rows"
  - id: anchor.m7.xy_n_t2_anchors
