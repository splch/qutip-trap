rance_change / d; the check_benchmarks and check_scaling oracles are re-recorded for the smaller caps, the branch counts and that shift (r_channel 2.120e-3 -> 2.133e-3, the four-qubit GHZ bound 0.99716 -> 0.99715), every other physics number printed to the oracles' digits unchanged"
