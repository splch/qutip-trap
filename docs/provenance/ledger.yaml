    corrected_form: "an uncompensated -38 Hz light shift over the 100 us fixture gate costs about 1e-3 of fidelity (an uncompensated 0.024 rad sigma_z rotation per ion); the M6 surrogate carried no Rabi or Stark entry for the entangling drive's beams, so its gate had no light-shift physics at all; M8 seeds them. Without the phase reference the compensated axis rotates by 2 pi delta_s t_start: a compensated GPi2 one millisecond into a schedule lost 1.5e-2 = (2 pi 38 Hz 1 ms)^2/4 on the two-ion fixture while the same pulse at t = 0 was exact, and the Bell circuit through run() read 4.2e-3 against M6's 2.35e-3 (anchor.m8.compensation_phase_reference)"
  - id: conv.servo_residual
    symbol: "x_k - x_hat_{k-1}, x_hat_k = x_hat_{k-1} + (1 - e^{-2 pi f_s dt})(x_k - x_hat_{k-1}), x_hat_0 = x_0"
    tag: background
    section: "7.5 Age, drift and cost; 6.2"
    source: "noise/model.py servo_residual; Drift.servo_bandwidth_hz"
    equation: "a Drift with a servo bandwidth is high-passed into its residual band over the shot clock: the residual variance of an OU drift of correlation time tau is sigma^2/(1 + 2 pi f_s tau) in the continuous limit and the drift's increment sigma^2 (2 dt/tau) for a lock re-armed every sample; the first sample carries no offset (the calibration measured it)"
    corrected_form: "the first version sampled raw quasi-static drift against a once-computed table, double-counting the slow band a laboratory servos away"
  - id: conv.calibration_cache
    symbol: "key = (Device.hash(), seed, surrogate, experiments, t0, digest(kwargs))"
    tag: background
    section: "7.5; Appendix E Device.hash"
    source: "calibration/cache.py"
    equation: "tables are cached per device configuration and noise seed; a table whose device_hash differs from the device it is asked for is never returned, so a changed parameter invalidates the old configuration's tables and the new one has none until calibrate runs (run(table=None) builds the surrogate)"
    corrected_form: ""
  - id: conv.observation_model
    symbol: "P_declared = P_bright (1 - eps_B) + (1 - P_bright) eps_D; k ~ Binomial(shots, P_declared)"
    tag: background
    section: "7.5 Every fit reports an uncertainty; 8.4"
    source: "experiments/fitting.py Observation, weighted_fit"
    equation: "every experiment reads its populations as shots declared through the readout's (eps_B, eps_D), keyed by (sample, trajectory, shot, ion, channel); the fits are weighted least squares whose covariance is scaled by max(1, chi^2/dof), so an under-fitting model widens its own error bars; shots=None returns the exact populations (the M2 to M7 behaviour)"
    corrected_form: "the first M8 build keyed the draws by (sample, point index, ion, outcome) only, so a calibration running the same experiment twice, or an experiment repeating a scan, replayed identical noise: the Stark scan read -12.67 Hz for BOTH beams of the fixture drive, exactly, and summed their uncertainties as if independent (3.3 sigma from the truth for a single 2.3 sigma draw counted twice); every experiment of a calibration and every sub-run now carries a stream label appended to the outcome key (Observation.stream, sub_stream)"
  - id: anchor.m8.sideband_light_shift
    symbol: "delta_sb = Omega^2/(2 omega_m)"
    tag: recomputed here
    section: "7.5 item 2; 4.3.2"
    source: "check_calibration.py 5; experiments/motion.py mode_spectroscopy"
    equation: "a resonant sideband pulse light-shifts the qubit through its own off-resonant CARRIER coupling by Omega^2/(2 omega_m) (1.70 kHz at Omega/2pi = 100.9 kHz, omega_m/2pi = 3 MHz), pulling both the blue and the red sideband resonance toward the carrier, so blue - carrier and (blue - red)/2 both read the mode frequency low by it; the scan fits the blue centre at two rf amplitudes and extrapolates to zero power (the shift scales as the intensity), which recovers the mode frequency within its uncertainty"
    corrected_form: "Section 7.5's fine scan of a single resonance at full power would have written the mode frequency low by 1.5 kHz into the table, above the FM solvers' sub-kilohertz need"
  - id: anchor.m8.stark_scan_per_beam
