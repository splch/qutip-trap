final states equal to 4.3e-10. The register update sum_a K_a rho K_a^dag as one superoperator product (sum_a K_a (x) conj K_a on the (local, local) x (rest, rest) reshape) 0.148 -> 0.010 s at ten qubits, difference 1.4e-18, and Register.marginal on the strided view 1.05 -> 0.08 ms, identical"
