# Provenance ledger (PLAN.md Section 14.5): one record per quantity, with the fields
#   id, symbol, tag, section, source, equation, corrected_form
# consumed by the core's Device.derived() provenance and by the application's provenance chips, so that the
# Section 9.11 coverage test is a set difference over ids. Tags follow Appendix D (verified, corrected,
# extracted, background, recomputed here, derived, contested); a tag records what checking was done, never that
# a value is final. Started at milestone M0 from Part II and Section 13: the convention rows the M0 code
# restates, the Section 9.13 acceptance anchors of the species layer, and every constant of the species tables
# (the block at the end is generated from the tables by tools/ledger_from_tables.py).
records:
  # ---- Section 13 conventions the M0 code encodes ------------------------------------------------------
  - id: conv.frequencies
    symbol: "omega = 2 pi nu"
    tag: corrected
    section: "13 Frequencies; 5.6"
    source: "RMP 2003 (Leibfried et al.)"
    equation: "internal frequencies angular in rad/s; public API in Hz, converted at the boundary with an explicit 2 pi"
    corrected_form: "papers quote gamma = 2 pi x 19.6 MHz, gamma/2pi = 60 MHz and 19.7 MHz for gamma/2pi interchangeably; the two are distinct types (qutip_trap.units.Hz, RadPerS)"
  - id: conv.mathieu_sign
    symbol: "a - 2q cos 2xi"
    tag: verified
    section: "13 Mathieu equation; 4.1.1"
    source: "Leibfried et al. 2003"
    equation: "d^2x/dxi^2 + [a - 2q cos 2xi] x = 0, xi = omega_rf t/2, a = 4Z|e|U alpha/(m omega_rf^2), q = 2Z|e|U~ alpha'/(m omega_rf^2)"
    corrected_form: "Wineland 1998 and Berkeland 1998 use +2q cos (a half-period shift); factor-4 q definitions elsewhere; House 2008 has Q = -q and prints its first-order matrix with the wrong sign"
  - id: conv.floquet_phase_origin
    symbol: "u(t) ~ e^{i nu t}[1 - (q/2) cos omega_rf t]"
    tag: corrected
    section: "13 Floquet function and rf phase origin; 4.1.1"
    source: "check_critique_v3.py; derivation audit 2026-09-04"
    equation: "u_dot(0) = i nu (1 + q) at u(0) = 1 in the adopted sign; C0 = 1 + 3q^2/16 even in q"
    corrected_form: "the RMP's quantum section, Wineland's trajectory and the plan's second revision use [1 + (q/2) cos], i nu (1 - q): the same physics half an rf period later"
  - id: conv.micromotion_correction
    symbol: "C0"
    tag: corrected
    section: "13 Micromotion correction; 4.1.1"
    source: "check_c0_floquet.py; Wineland Eqs. 71-72; Berkeland Eq. 21"
    equation: "eta_eff = eta C0, C0 the e^{i nu t} Fourier coefficient of the exact Floquet function normalized by Im(u* u_dot) = nu: C0 = 1 + 3q^2/16 + O(q^4) (1.007741 at q = 0.2)"
    corrected_form: "the RMP's (1 + q/2)^-1 is the u(0) = 1 normalization at one rf phase, an rf-clock artifact [corrected: derivation audit, 2026-09-04]"
  - id: conv.ladder_operators
    symbol: "x0"
    tag: verified
    section: "13 Ladder operators"
    source: "RMP Eq. 26"
    equation: "x = x0 (a + a^dagger), x0 = sqrt(hbar/(2 m omega))"
    corrected_form: "Brownnutt arXiv v1 prints a with sqrt(hbar m omega); Ozeri 2007 and Baldwin 2021 put a factor 4 under the root"
  - id: conv.lamb_dicke
    symbol: "eta_{i,m}"
    tag: verified
    section: "13 Lamb-Dicke parameter, Lamb-Dicke base; 4.1.7"
    source: "Wineland 1998 Eq. 33; Monroe 2020; Home 2013 Eq. 19; Morigi-Walther Eq. 12"
    equation: "eta_{i,m} = (Delta k . e_m) c_{i,m} sqrt(hbar/(2 m_i omega_m)) with the ion's own mass and the mass-weighted unit-norm eigenvector component; C0 applied once in Crystal.lamb_dicke"
    corrected_form: "Sorensen-Molmer's and Leung's per-ion COM eta already contains 1/sqrt N; Srinivas puts the total two-ion mass inside r0"
  - id: conv.mode_index
    symbol: "mode: int"
    tag: corrected
    section: "13 Mode index; 4.1.3; Appendix E"
    source: "PLAN.md Appendix E"
    equation: "every mode index is a position in Crystal.modes, ordered axial, transverse_1, transverse_2, ascending frequency within a family; eigenvectors unit norm, last component positive"
    corrected_form: "eigensolver output order, frequency order across families or (family, index) pairs, none declared in the second revision [corrected: critique, 2026-09-04]"
  - id: conv.rabi_frequency
    symbol: "Omega"
    tag: verified
    section: "13 Rabi frequency; 4.3.1"
    source: "RMP 2003; Monroe 2020; Lee 2005"
    equation: "H = (hbar Omega/2) sigma_+ e^{...} + h.c., carrier pi pulse at Omega t = pi"
    corrected_form: "Wineland 1998, Monroe 1995 and Blumel 2021 use P = sin^2(Omega t), half the usual Rabi frequency"
  - id: conv.detuning
    symbol: "delta = omega_drive - omega_transition"
    tag: verified
    section: "13 Detuning, Detuning symbols"
    source: "RMP 2003; Run 2B consolidation"
    equation: "delta from the carrier, red negative; mu = beat-note detuning from the carrier; delta_{i,m} = mu_i - omega_m always two-indexed"
    corrected_form: "Landsman's delta measured from a mode; Mount's dimensionless delta"
  - id: conv.effective_wavevector
    symbol: "Delta k = k_1 - k_2"
    tag: corrected
    section: "13 Effective wavevector"
    source: "RMP; Wineland 1998; Lee 2005"
    equation: "beam 1 couples to the upper level; |Delta k| = 2k sin(theta_cross/2) from the configured geometry; k for one beam, 0 for a microwave"
    corrected_form: "Landsman's k = k_2 - k_1; Lee's arXiv v1 Eq. 2 inverts its own beam-to-level assignment [corrected: preprint only]"
  - id: conv.wavelengths_vacuum
    symbol: "lambda_vac"
    tag: corrected
    section: "4.5.7; 13 Quadrupole (E2) coupling"
    source: "James 1998; Roos 2000; NIST Sr II compilation"
    equation: "k = 2 pi/lambda_vac; every stored wavelength is a vacuum wavelength"
    corrected_form: "James's Fig. 4 quotes the calcium wavelengths in air (729.147 nm; vacuum 729.347 nm); an air value used as vacuum biases k by 274 ppm and gives the wrong laser frequency outright"
  - id: conv.saturation_intensity
    symbol: "I_sat"
    tag: corrected
    section: "13 Saturation intensity, Saturation-intensity rate; 4.5.2; 9.13"
    source: "Steck; check_critique_v3.py"
    equation: "I_sat = pi h c Gamma_partial/(3 lambda_vac^3) with Gamma_partial = 2 pi gamma_hz x branching ANGULAR; 171Yb+ 369.5 nm: 50.83 mW/cm^2"
    corrected_form: "gamma_hz fed in unconverted gives 8.09 mW/cm^2 (a 2 pi in every saturation parameter); Acton prints hbar for h; the random-orientation hbar omega^3 Gamma/(4 pi c^2) is exactly 3x the cycling value [corrected: critique, 2026-09-04]"
  - id: conv.linewidth_gamma
    symbol: "Gamma"
    tag: verified
    section: "13 Linewidth Gamma; Appendix E Transition.gamma_hz"
    source: "Noek 2013; Crain 2019"
    equation: "Gamma is the angular population decay rate of the upper level's TOTAL decay; gamma_hz = Gamma/2pi; the partial rate into a lower level is Gamma x branching"
    corrected_form: "an assertion checks Gamma/2pi equals the quoted MHz"
  - id: conv.dipole_normalization_stack
    symbol: "<J||d||J'>"
    tag: corrected
    section: "13 Dipole-element normalization stack; 4.5.6"
    source: "Steck QAO Eqs. 7.237-7.283; Rb87 Eqs. 34-42"
    equation: "Gamma_{J'->J} = omega^3 (2J+1) |<J||d||J'>|^2/(3 pi eps0 hbar c^3 (2J'+1)) is the total rate out of J' into the level J, b/tau; the stretched cycling element is sqrt(1/2) <J||er||J'> on a J = 1/2 -> 3/2 line; Edmonds' round bracket is sqrt(2j+1) larger"
    corrected_form: "the 'total rate into a partial-rate formula' factor the second revision listed does not exist; stacking a reduced element into a stretched-element formula is a factor 2 on a D2 line [corrected: derivation audit, 2026-09-04]"
  - id: conv.hyperfine_dipole_element
    symbol: "<F mF|d_q|F' mF'>"
    tag: verified
    section: "13 Hyperfine dipole matrix elements; 4.5.2"
    source: "Steck (Rb87 data, Eqs. 35-38)"
    equation: "<F mF|d_q|F' mF'> = <J||d||J'> (-1)^{F'+J+1+I} sqrt((2F'+1)(2J+1)) {J J' 1; F' F I} (-1)^{F'-1+mF} sqrt(2F+1) (F' 1 F; mF' q -mF); q = m_lower - m_upper"
    corrected_form: "the simulator reproduces the 171Yb+ 1/3 : 2/3 branching and the 50.8 mW/cm^2 I_sat as its ingest test (9.13)"
  - id: conv.hyperfine_factors
    symbol: "S_FF', b(F'->F)"
    tag: corrected
    section: "13 Hyperfine factors"
    source: "Steck Rb87 Eqs. 40-42"
    equation: "S_FF' = (2F'+1)(2J+1){J J' 1; F' F I}^2 summing to one over excited F' (absorption); b(F'->F) = (2F+1)(2J'+1){...}^2 summing to one over ground F (emission)"
    corrected_form: "one 'hyperfine factor' used in both roles is off by (2F+1)(2J'+1)/((2F'+1)(2J+1))"
  - id: conv.nuclear_g_sign
    symbol: "g_I"
    tag: recomputed here
    section: "13 Nuclear g-factor sign; 4.5.1"
    source: "Steck; Harty 2014"
    equation: "g_I = -(mu_I/(I mu_N))(m_e/m_p), so H_Z = mu_B (g_J J_z + g_I I_z) B/hbar with one sign for both; 43Ca+ g_I = +2.0467e-4 from mu_I = -1.31535 mu_N"
    corrected_form: "Harty's g_I^(N) = mu_I/(I mu_N) with a minus sign and Langer's g_I = -mu_I/(I mu_B) with a plus are self-consistent alternatives that must not be mixed: 83.76 kHz and 0.207 G off for 43Ca+"
  - id: conv.sign_A_hfs_and_g_factors
    symbol: "sign(A_hfs), g_S"
    tag: corrected
    section: "13 Sign of A_hfs and the g-factors; 4.5.6"
    source: "Steck; Langer 2005; Harty 2014"
    equation: "A_hfs is a signed input inferred from mu_I when not printed (9Be+, 43Ca+, 171Yb+ 3D[3/2]1/2 inverted); measured g_J replaces Lande; Steck's g_S = +2.0023193 (CODATA g_e is negative); nuclear Zeeman in Steck's form with a plus sign in H_B"
    corrected_form: "A > 0 removes the clock points (no 43Ca+ point in 1 to 4000 G, no 9Be+ root in 8 to 16 mT), the ingest test of the sign"
  - id: conv.curvature_naming
    symbol: "d2nu_dB2, taylor_c2"
    tag: corrected
    section: "13 Curvature naming; 4.5.1; 6.3"
    source: "Harty 2014; Langer 2005; derivation audit 2026-09-04"
    equation: "d2nu_dB2 (Harty's 2.4 mHz/mG^2) and taylor_c2 = (1/2) d2nu/dB2 (Langer's 0.305 Hz/uT^2; 171Yb+'s 310.8 Hz/G^2) stored separately; accumulated phase 2 pi int [nu(B) - nu(B0)] dt with the bracket in Hz"
    corrected_form: "one field named 'curvature' silently mixes a factor 2; the missing 2 pi is 6.28 in both of Langer's figures"
  - id: conv.mass_ion
    symbol: "mass_u"
    tag: recomputed here
    section: "9.16 row 13-6; 5.6"
    source: "derivation audit 2026-09-04; AME via NIST"
    equation: "Species.mass_u is the ION mass, the cited atomic mass minus one electron mass (171Yb+: 170.93578 u from 170.9363302 u); the Lamb-Dicke anchor must state its mass"
    corrected_form: "eta(N = 17) rounds to 0.0267 at 171 u and 0.0268 at the ion mass"
  - id: conv.polarization_components
    symbol: "eps_q"
    tag: corrected
    section: "13 Polarization components; 4.5.3"
    source: "Steck QAO Eqs. 7.188-7.190, 7.419-7.422; Rb87 Eqs. 34-37, 54-55"
    equation: "eps = sum_q eps_q e_q about B, e_{+-1} = -+(x +- i y)/sqrt 2, e_0 = z; helicity q_gamma = +1 (sigma+), 0 (pi), -1 (sigma-) for absorption |F mF> -> |F' mF + q_gamma>; operator index q_op = m_lower - m_upper = -q_gamma"
    corrected_form: "Steck's tables list sigma+ under q = -1; extracted items interchanged the two labels"
  - id: conv.quadrupole_element_normalization
    symbol: "<v||Q||w>"
    tag: recomputed here
    section: "13 Reduced quadrupole element for D-state lifetimes; 4.5.7"
    source: "Kreuter et al. 2005 Eqs. 7-8; W. R. Johnson's lecture notes"
    equation: "A = (1/15)(omega/c)^5 |<v||Q||w>|^2/(2 j_v + 1) with the UPPER-state degeneracy, prefactor 1.11995e18/lambda[A]^5 s^-1 on vacuum wavelengths (Transition.quadrupole_convention = johnson_1_15)"
    corrected_form: "the (1/75)(omega/c)^5 convention gives exactly one fifth, so its elements are sqrt 5 larger; air wavelengths shift tau by 0.15%"
  - id: conv.electric_field_noise
    symbol: "S_E"
    tag: corrected
    section: "13 Electric-field noise density; 4.1.5"
    source: "Brownnutt Eqs. 11-12"
    equation: "single-sided S_E; Gamma_h = e^2 S_E/(4 m hbar omega)"
    corrected_form: "two-sided gives e^2 S_E/(2 m hbar omega); Turchette's arXiv preprint prints Eq. 3 inconsistent by 2, the published PRA is consistent [corrected: preprint only]; the filter-function stack uses TWO-sided spectra, converted explicitly at the boundary"
  - id: conv.heating_master_equation
    symbol: "Gamma(N_bar + 1), Gamma N_bar"
    tag: corrected
    section: "13 Heating master equation, Heating-rate meaning"
    source: "Wineland Eq. 62 (typo fixed); Brownnutt Eqs. 15-17"
    equation: "rates Gamma(N_bar + 1) on a and Gamma N_bar on a^dagger; a quoted heating rate is d<n>/dt at n = 0, i.e. Gamma N_bar; thermal diffusion Gamma(2 N_bar + 1)"
    corrected_form: "the journal prints 2 a rho^dagger a^dagger, a typesetting artifact absent from both arXiv versions"
  - id: conv.qubit_dephasing_operator
    symbol: "L = sqrt(gamma_phi/2) sigma_z"
    tag: corrected
    section: "13 Qubit dephasing operator; 5.7; 6.3"
    source: "PLAN.md Section 5.7; Ramsey test in 9.7"
    equation: "coherence decays at gamma_phi, so gamma_phi = 1/T2 for the white component; a measured T2 is split into quasi-static (Gaussian) and white (exponential) parts before use"
    corrected_form: "conventions giving 2/T2 elsewhere [row added after the 2026-09-04 critique]"
  - id: conv.rayleigh_dissipator
    symbol: "c = (1/2) sqrt(Gamma_el) sigma_z"
    tag: recomputed here
    section: "13 Rayleigh dephasing dissipator; 4.5.5"
    source: "Uys et al. 2010 Eqs. 6-8"
    equation: "dissipator prefactor Gamma_el/4 while the coherence decays at Gamma_el/2, both consistent; Raman operators sqrt(Gamma_du)|u><d| carry the plain rate"
    corrected_form: "sqrt(Gamma_el/2) sigma_z doubles the dephasing"
  - id: conv.rf_amplitude_pseudopotential
    symbol: "V_rf peak"
    tag: corrected
    section: "13 rf amplitude and pseudopotential"
    source: "House; Wesenberg; Chiaverini; Madsen; Home; Kielpinski; derivation audit 2026-09-04"
    equation: "V_rf is the PEAK of a cos(Omega_rf t) drive; psi = Q^2|E|^2/(4 m Omega^2) in joules (eV at the boundary); Blakestad's phi_ps = q(V_rf grad phi~_rf)^2/(4 m Omega_rf^2) is the same peak convention in volts"
    corrected_form: "reading the stored peak as rms doubles the depth and inflates every rf-set secular frequency by sqrt 2; as peak-to-peak quarters the depth and halves those frequencies; the second revision paired a halved depth with a sqrt 2-inflated frequency, which no single field factor gives"
  - id: conv.ms_closure
    symbol: "eta Omega/eps = 1/(2 sqrt K)"
    tag: corrected
    section: "13 Spin operator in MS formulas; 4.4.1"
    source: "Sorensen-Molmer 2000; Kirchmair 2009; Roos 2008; check_ms_closure.py"
    equation: "the force on S_y is -(hbar eta Omega/2)(a^dagger e^{i eps t} + h.c.) for the plan's per-tone Omega; closure eta Omega/eps = 1/(2 sqrt K) in every spin normalization; targets -pi/2 on J_y^2, -pi/8 on S_y^2, pi/4 on sigma_y sigma_y"
    corrected_form: "the second revision halved the closure to 1/(4 sqrt K), a factor-2 force error caught by the derivation audit; Roos's Omega_c = |eps|/(4 eta) reads |eps|/(2 eta) in the plan's Omega"
  - id: conv.entangling_angle
    symbol: "chi_ij"
    tag: corrected
    section: "13 Entangling angle; 4.4.3"
    source: "Choi 2014; Maslov 2017; Debnath 2016; derivation audit 2026-09-04"
    equation: "chi_ij = sum_m eta_im eta_jm int int [Omega_i(t) Omega_j(t') + Omega_j(t) Omega_i(t')] ... with the pair sum over i < j; maximally entangling at chi = pi/4; XX(chi) = exp(-i chi sigma_x sigma_x)"
    corrected_form: "Choi's printed factor 2 holds only for proportional envelopes; Blumel's kernel with target pi/8 must be doubled; Roos's and Kirchmair's pi/8 comes from S without the 1/2 and must not be rescaled"
  - id: conv.gate_parameters
    symbol: "turns"
    tag: corrected
    section: "13 Gate parameters; 7.6"
    source: "IonQ documentation"
    equation: "radians internally; IonQ turns at the API boundary (1 turn = 2 pi); phases enter as e^{+-2 pi i phi}, angles as cos(pi theta), sin(pi theta)"
    corrected_form: "the documentation's prose that GPi2 at phi = 0.5 gives R_x(+pi/2) contradicts its own matrix (it is R_x(-pi/2))"
  - id: conv.native_ms_matrix
    symbol: "MS(phi0, phi1, theta)"
    tag: verified
    section: "7.6 IonQ cloud notation"
    source: "IonQ documentation; qiskit-ionq, ionq-core-python, PennyLane-IonQ client code read 2026-09-04"
    equation: "MS(phi0, phi1, theta) = exp[-i pi theta GPi(phi0) (x) GPi(phi1)] with theta in turns in [0, 0.25]; GPi(phi) = [[0, e^{-2 pi i phi}], [e^{2 pi i phi}, 0]]; GPi2(phi) = (1/sqrt 2)[[1, -i e^{-2 pi i phi}], [-i e^{2 pi i phi}, 1]]; ZZ(theta) = diag(e^{-i pi theta}, e^{i pi theta}, e^{i pi theta}, e^{-i pi theta}); XX(chi) = MS(0, 0, theta) with chi = pi theta"
    corrected_form: ""
  - id: conv.virtual_z_propagation
    symbol: "phi -> phi - theta"
    tag: corrected
    section: "13 Virtual-Z propagation; 7.6"
    source: "PLAN.md Section 7.6 (recomputed)"
    equation: "RZ(theta) shifts every later pulse phase phi -> phi - theta, gates read in time order: RZ(theta), GPi(0.5), GPi2(0) equals GPi(0.5 - theta), GPi2(-theta) followed by RZ(theta)"
    corrected_form: "IonQ's printed +theta holds in matrix order; the second revision's 5.2 printed +theta in time order [corrected: critique, 2026-09-04]"
  - id: conv.operator_order_templates
    symbol: "right-to-left"
    tag: corrected
    section: "13 Operator order in templates; 7.7"
    source: "Maslov 2017 Sec. 2.2"
    equation: "matrix product written right-to-left, circuit time left-to-right; every template checked numerically"
    corrected_form: "Maslov's '.' reverses circuit order; IonQ's virtual-Z rule sign depends on this"
  - id: conv.result_bit_order
    symbol: "qubit0_lsb"
    tag: verified
    section: "13 Result bit order; 8.6; 9.13"
    source: "IonQ OpenAPI v0.4; qiskit-ionq and PennyLane-IonQ client code"
    equation: "qubit 0 is the least-significant bit of the decimal histogram key; {\"5\": 0.5, \"7\": 0.5} on three qubits <-> bitstrings 101, 111; shots [\"6\",\"1\",\"0\",\"7\"] <-> 110, 001, 000, 111"
    corrected_form: "PennyLane reverses to big-endian [verified against the client sources]"
  - id: conv.ionq_json_encoding
    symbol: "gpi, gpi2, ms, zz, nop"
    tag: verified
    section: "7.6 JSON encoding of the native set; 9.13"
    source: "IonQ OpenAPI v0.4; qiskit-ionq, ionq-core-python, PennyLane-IonQ client code read 2026-09-04"
    equation: "gpi/gpi2 take target and phase (turns); ms takes targets, phases (turns) and angle (turns, default 0.25); zz takes targets and angle only; the job body is {type: ionq.circuit.v1, input: {gateset, qubits, circuit}}"
    corrected_form: "the 0 to 0.25 range of the ms angle is stated only by the PennyLane plugin's docstring"
  - id: conv.readout_figure_of_merit
    symbol: "eps = (eps_B + eps_D)/2"
    tag: verified
    section: "13 Readout figure of merit"
    source: "Myerson; Burrell; Harty; Christensen"
    equation: "eps = (1/2)(eps_B + eps_D), both reported"
    corrected_form: "Acton's min(F_B, F_D)"
