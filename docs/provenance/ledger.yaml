    tag: corrected
    section: "9.6 row 3 ('the intrinsic budget lists off-resonant carrier, Bessel force saturation, residual displacement, Debye-Waller'); 4.4.1 (Roos Eq. 17); 4.3.1"
    source: "Roos 2008, New J. Phys. 10, 013002, Eq. 17 (qutip_trap/validation/two_qubit_closed_forms.roos_force_saturation, run/job.roos_bessel_saturation); Wineland et al. 1998, NIST J. Res. 103, 259, Eq. 18 with the phase of Eq. 21 (hilbert/operators.rabi_matrix_element, run/job.sideband_lamb_dicke_deficit)"
    equation: "Section 9.6's 'Bessel force saturation' is Roos's carrier correction: the spin-dependent force is scaled by (J_0 + J_2)(x) at x = 4 Omega/mu (Omega the tone Rabi frequency, mu the tone-to-carrier detuning), so an uncalibrated pulse solved with the linear force reaches chi (1 - f)^2 with f = 1 - (J_0 + J_2)(x) = x^2/8 + O(x^4), an angle error pi f/2 at chi = pi/4 and a Bell-state infidelity sin^2(pi f/2); intrinsic_budget reports it per played MS gate as '<gate>.bessel_saturation' at the waveform's largest amplitude and smallest |mu| and sums it into 'total'. On the Section 11.1 pulse (Omega/2pi = 64.148 kHz, mu/2pi = 3.01 MHz) x = 0.0852, f = 9.1e-4 and the term is 2.0e-6, far inside the row's 1.1e-4 as the row's sum requires. The sideband element's Lamb-Dicke deficit f_LD = 1 - Omega_{n+1,n}/(Omega eta sqrt(n + 1)), with Omega_{n+1,n}/Omega = e^{-eta^2/2} (eta/sqrt(n+1)) |L^{(1)}_n(eta^2)|, is reported as '<gate>.sideband_lamb_dicke_deficit' (worst case over the gate's ions and carried modes at the cap's top Fock index) and NOT summed"
    corrected_form: "the row names four contributions and the M6 budget carried three; the first M6 fix added the Wineland Lamb-Dicke deficit under the row's name and summed it (3.06e-2 at the Section 11.1 pulse's cap top n = 11, which dominated every budget total although that Fock state is unpopulated), while the row's term is Roos Eq. 17 (PLAN.md 4.4.1: 'the force is saturated by (J_0 + J_2)' at argument 4 Omega/delta). The 2026-09-08 consolidation entered the Roos term under the row's key as an infidelity scale and moved the Lamb-Dicke deficit to its own reported key outside the sum: its thermal mean is exactly the force rescaling the s^2 calibration of Section 4.4.7 (7) absorbs and its thermal spread is the Debye-Waller term (ballance_thermal_error) the total already carries, so summing it double counted. Both are upper bounds on what survives calibration, not estimates of it"
