    corrected_form: "the row's 'about 5x the rate-difference estimate' is a RATIO TO ZERO and no finite factor may be pinned: at the detuning where the two elastic rates coincide the Ozeri estimator (Gamma_uu - Gamma_dd)^2/(Gamma_uu + Gamma_dd) is EXACTLY 0 while Uys's Gamma_el - the square of the amplitude DIFFERENCE - saturates its upper bound 2(Gamma_dd + Gamma_uu). That structure is what the test pins. The crossing detuning has the closed form D = u D_f/(u + v) with u, v the summed a^(1/2) and a^(3/2) amplitudes"
