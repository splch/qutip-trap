    equation: "run(..., internal_levels = d > 2) turns the flag on and records it in the run's notes; internal_levels = 2 keeps the d = 2 per-pulse estimate path of Section 4.3.2. The automatic switch turns on the register operators (leakage into the SINK, spin flips, the differential Rayleigh operator) WITHOUT the recoil displacements: Section 4.5.5's d > 2 requirement is about leakage, and the recoil-dressed operators (one per emission direction, per pulse, per branch) cost 30 to 50x more on the two-ion fixture, so they remain an explicit choice (scattering_channels=True with scattering_recoil='minimal' or 'vector'); a caller who set scattering_recoil='vector' keeps it"
