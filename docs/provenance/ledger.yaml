    equation: "QuTiP's parallel map forks its workers, so each starts as a copy-on-write image of the parent and Python's reference counting dirties every page a worker touches; a parent that has grown to P bytes over a long session can therefore turn N workers into up to N x P. worker_count now returns min(requested or available_cpu_count, floor(MEMORY_FRACTION_FOR_WORKERS x physical memory / max(peak RSS, MIN_PARENT_BYTES))) with MEMORY_FRACTION_FOR_WORKERS = 0.5 and MIN_PARENT_BYTES = 512 MB, so the workers' worst-case total stays inside half of physical memory: a 3 GB parent on a 48 GB machine gets 8 workers, a 6 GB one 4, a fresh process every CPU. The engine's mcsolve num_cpus and every map_tasks caller read worker_count, and the reports (EngineReport.workers, Diagnostics.workers) state the count actually used"
