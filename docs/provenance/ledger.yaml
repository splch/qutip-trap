    equation: "the Knill-style variant of Section 7.9 runs through run() as a protocol, not as an analytic model: per computational gate a random Pauli (a pi rotation about +-x or +-y as one GPi pulse, about +-z as a virtual RZ, or an identity) then a random Clifford (one GPi2 about +-x or +-y), closed by ONE final pi/2 into the computational basis, the ideal state never leaving the six Pauli eigenstates so that the survival is the probability of the sequence's own target bitstring. On ion 0 of the two-ion example device (L = 1, 128, 512, two sequences, 2000 shots) the survival is 0.9995, 0.9985, 0.985, fitting F(L) = 0.4995 x 0.99998^L + 0.5000 with p = 0.999983(9) and r = (1 - p)/2 = 8.50(44)e-6 per computational gate at 1.561 pulses per gate. That is BELOW the Clifford-RB r = 1.97e-5 per Clifford at 0.829 pulses, although a computational gate costs 1.9x the pulses: the Pauli randomization twirls the pulses' coherent errors toward a depolarizing channel, so the partial cancellation Clifford RB relies on is replaced by an average that does not accumulate"
