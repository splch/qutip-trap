    tag: corrected
    section: "3.4; Appendix E SeedSpec"
    source: "PLAN.md Section 3.4; 2026-09-04 numerics critique"
    equation: "one root SeedSequence per run spawned by (sample, trajectory, shot, ion, channel); reproducibility over 1 and 18 workers is a 1e-12 tolerance test, not bitwise"
