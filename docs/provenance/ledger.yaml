    equation: "the depolarizing channel is written with the uniform weight eps/(4^n - 1) on each of the 4^n - 1 non-identity Paulis, in which eps is exactly the entanglement infidelity, so the rate the simulator reports is the entanglement infidelity and the average gate infidelity is d/(d + 1) eps, (2/3) eps at n = 1 and (4/5) eps at n = 2; as Kraus operators that is sqrt(1 - eps) 1 with sqrt(eps/3) X, Y, Z on one qubit or sqrt(eps/15) P over the fifteen non-identity two-qubit Paulis, and sum_K K^dag K = 1 to 1e-12 for every eps in [0, 1] (depolarizing_kraus); Qiskit's depolarizing_error takes the mixing weight of the maximally mixed state, lambda = eps 4^n/(4^n - 1), so Chen et al.'s Forte medians 2.0e-4 (single-qubit) and 46.4e-4 (two-qubit, direct RB) enter Qiskit as 2.67e-4 and 49.5e-4 (qiskit_depolarizing_lambda)"
    corrected_form: "Trout 2018's p/3 and p/15 are the same weights under a different name for the parameter, not a different channel; Qiskit's lambda is NOT that p, and passing a published p to Qiskit as a lambda understates the rate by 4^n/(4^n - 1), 33 % on one qubit and 6.7 % on two. Kept separate from conv.rb_error_rate, whose p is a decay BASE, and from conv.gate_fidelity_measure, whose F_K is a unitary overlap: this row is a channel RATE"
  - id: conv.gate_fidelity_measure
    symbol: "F_K = (1/4)|Tr(U_id^dag U)|^2"
    tag: corrected
    section: "13; 4.3.5; 6.9"
    source: "Kabytayev et al. 2014 Sec. II B; Cummins et al. 2003 Eq. 7; Merrill and Brown Eqs. 10-11; qutip_trap.control.composite"
    equation: "for a single-qubit unitary error the internal measure is F_K = (1/4)|Tr(U_id^dag U)|^2, the normalization the composite-pulse library and the Section 6.9 filter functions are built to, which floors at 1/2 for a fully wrong qubit gate; F_C = |Tr(U_id^dag U)|/2 = sqrt(F_K) and F_avg = (2 F_C^2 + 1)/3 = (2 F_K + 1)/3 are conversions, so 1 - F_K = 2(1 - F_C) and 1 - F_avg = (4/3)(1 - F_C) at leading order, and every ingested coefficient is tagged with the measure it was quoted in; at small spectral-norm distance E, 1 - F_C ~ E^2/2 and 1 - F_K ~ E^2; kept separate from conv.rb_error_rate (a decay base) and conv.depolarizing_normalization (a channel rate): this is a unitary overlap"
    corrected_form: "Low, Yoder and Chuang's F = ||U V^dag|| is identically 1 for a qubit under its own Eq. 2 norm and Brown, Harrow and Chuang's 1 - ||V^dag U|| identically 0 for unitaries; both are replaced by F_K"
