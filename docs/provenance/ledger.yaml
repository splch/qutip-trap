    source: "Berkeland Eqs. 13-14 and 21 for the two special cases; the general form derived by the Run 5 consolidation"
    equation: "P_f^max = (2J_f + 1)/((2J_i + 1) + (2J_f + 1)): Gamma/4 for 3 ground + 1 excited, Gamma/3 for a Lambda system, Gamma/2 for a two-level atom"
    corrected_form: "the two-level Lorentzian's Gamma/2 applied to a degenerate manifold; a 'naive four-level' 1/2 for the 171Yb+ detection line"
  - id: conv.solver_integrators
    symbol: "dop853, vern9"
    tag: recomputed here
    section: "5.3 Solvers; Appendix E SolverOptions"
    source: "PLAN.md Section 5.3; bench_numerics.py"
    equation: "the escalation ladder is dop853 then vern9; never a multistep method; atol 1e-10, rtol 1e-8"
    corrected_form: ""
  - id: conv.seed_keys
    symbol: "SeedSequence(root, spawn_key=(sample, trajectory, shot, ion, channel))"
    tag: corrected
    section: "3.4; Appendix E SeedSpec"
    source: "PLAN.md Section 3.4; 2026-09-04 numerics critique"
    equation: "one root SeedSequence per run spawned by (sample, trajectory, shot, ion, channel); reproducibility over 1 and 18 workers is a 1e-12 tolerance test, not bitwise"
