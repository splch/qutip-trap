[project]
name = "qutip-trap"
version = "0.4.0"
description = "First-principles trapped-ion quantum computer simulator built on QuTiP"
readme = "README.md"
requires-python = ">=3.13,<3.15"
authors = [{ name = "Spencer Churchill", email = "25377399+splch@users.noreply.github.com" }]
dependencies = [
    "qutip>=5.3.1,<5.4",
    "numpy>=2.4,<3",
    "scipy>=1.18,<2",
]

[project.optional-dependencies]
# Flet 0.86 is the announced last line before 1.0; review the pin when 1.0 ships.
gui = ["flet[all]>=0.86,<1.0", "flet-charts>=0.86,<1.0"]
plot = ["matplotlib>=3.10"]
qiskit = ["qiskit>=2.0,<3"]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "hypothesis>=6.135",
    "ruff>=0.13",
    "mypy>=1.17",
    "sympy>=1.14",
    "mpmath>=1.3",
    "qiskit>=2.0,<3",
    "pytest-xdist>=3.8.0",
    "pytest-timeout>=2.4.0",
]

[tool.uv.workspace]
members = ["qutip_trap_app"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qutip_trap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: level-C solves that take more than a few seconds (run in CI, deselect locally with -m 'not slow')",
    "heavy: must run alone in CI, after the parallel pass: peak resident memory of several gigabytes (the direct sparse factorization of a large Liouvillian, which beside three other workers exhausts a 16 GB runner and stalls the run in swap), or a wall-time measurement that four competing workers would falsify",
]

[tool.ruff]
line-length = 110
target-version = "py313"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# E501: the formatter governs code line length; long docstring/comment lines are allowed
ignore = ["B905", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["qutip_trap", "qutip_trap_app"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["qutip_trap"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["qutip", "qutip.*", "scipy", "scipy.*", "flet", "flet.*", "qiskit", "qiskit.*", "matplotlib", "matplotlib.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# qiskit ships no type information mypy can use here, so its base classes resolve to Any
module = ["qutip_trap.interop.qiskit"]
disallow_subclassing_any = false
